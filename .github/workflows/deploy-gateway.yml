# Déploiement automatique de la passerelle (Apps Script) : tests -> clasp push -> nouvelle version sur la MÊME URL.
# Prérequis (une fois) : voir docs/DEPLOIEMENT-AUTO.md
name: Déployer la passerelle

on:
  push:
    branches: [claude/exciting-ritchie-u1o1dl, main]
    paths: ['apps-script/gateway/**', 'js/simulation.js', 'js/annuaire-data.js', 'badges/badges.js', 'apps-script/prise-en-charge/Enquetes.gs', '.github/workflows/deploy-gateway.yml']
  workflow_dispatch:

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: "Copier le moteur de simulation (partagé avec le site, js/simulation.js)"
        run: cp js/simulation.js apps-script/gateway/Simulation.gs

      - name: "Copier les fiches contact (partagées avec le site, js/annuaire-data.js)"
        run: sed 's/^window\.ANNUAIRE_DATA = /var ANNUAIRE_DATA = /' js/annuaire-data.js > apps-script/gateway/AnnuaireContacts.gs

      - name: "Copier le moteur des badges (partagé avec le site, badges/badges.js)"
        run: cp badges/badges.js apps-script/gateway/BadgesMoteur.gs

      - name: "Copier l'injection dans les Enquêtes (partagée avec Prises en charge)"
        run: cp apps-script/prise-en-charge/Enquetes.gs apps-script/gateway/EnquetesPartage.gs

      - name: Tests
        run: node --test apps-script/gateway/test/*.test.js

      - name: Vérifier la configuration
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.GATEWAY_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.GATEWAY_DEPLOYMENT_ID }}
        run: |
          missing=0
          [ -z "$CLASPRC_JSON" ] && echo "::error::Secret CLASPRC_JSON manquant" && missing=1
          [ -z "$SCRIPT_ID" ] && echo "::error::Variable GATEWAY_SCRIPT_ID manquante" && missing=1
          [ -z "$DEPLOYMENT_ID" ] && echo "::error::Variable GATEWAY_DEPLOYMENT_ID manquante" && missing=1
          exit $missing

      - name: Contrôler le secret CLASPRC_JSON
        id: fmt
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          OUT: ${{ runner.temp }}/clasprc.json
        run: |
          umask 077
          node -e '
            const fs = require("fs");
            let brut = String(process.env.CLASPRC_JSON).trim(), j, repare = false;
            try { j = JSON.parse(brut); }
            catch (e1) {
              // Cas fréquent : les accolades { } extérieures n ont pas été copiées.
              try { j = JSON.parse("{" + brut.replace(/^,|,$/g, "") + "}"); repare = true; }
              catch (e2) { console.log("::error::CLASPRC_JSON illisible : recopier TOUT le fichier .clasprc.json, du premier { au dernier } (" + e1.message + ")"); process.exit(1); }
            }
            console.log("Clés de premier niveau :", Object.keys(j).join(", "), repare ? "(accolades extérieures ajoutées)" : "");
            const v3 = !!j.tokens, v2 = !!j.token;
            if (!v2 && !v3) { console.log("::error::CLASPRC_JSON ne contient ni token ni tokens : ce n est pas un fichier .clasprc.json issu de clasp login"); process.exit(1); }
            fs.writeFileSync(process.env.OUT, JSON.stringify(j), { mode: 0o600 });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "clasp=" + (v3 ? "3" : "2") + "\n");
            console.log("Format détecté : clasp", v3 ? "3" : "2");
          '

      - name: Installer clasp
        run: npm install -g @google/clasp@${{ steps.fmt.outputs.clasp }}

      - name: Envoyer le code et publier une nouvelle version
        working-directory: apps-script/gateway
        env:
          CLASPRC_FILE: ${{ runner.temp }}/clasprc.json
          SCRIPT_ID: ${{ vars.GATEWAY_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.GATEWAY_DEPLOYMENT_ID }}
        run: |
          umask 077
          cp "$CLASPRC_FILE" "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp --version
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "${GITHUB_SHA::7} — $(git log -1 --pretty=%s | cut -c1-60)"
          rm -f "$HOME/.clasprc.json" "$CLASPRC_FILE" .clasp.json
