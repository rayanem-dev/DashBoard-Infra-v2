<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Organigramme – Division Infrastructure RNS</title>
<meta name="theme-color" content="#E85D04">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/charte.css">
<style>
  .barre-o { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .barre-o input[type=text] { flex: 1 1 260px; max-width: 420px; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 10px; font: inherit; font-size: 14px; }
  .barre-o .legende span { margin-right: 14px; }
  .racine { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-card); border-top: 4px solid var(--orange-main); padding: 14px 18px; margin-bottom: 18px; }
  .grille-s { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
  .svc { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-card); padding: 0; overflow: hidden; }
  .svc > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; border-bottom: 3px solid var(--c-T); }
  .svc > summary::-webkit-details-marker { display: none; }
  .svc > summary small { font-weight: 700; color: var(--text-muted); font-size: 12px; }
  .svc .corps { padding: 6px 8px 10px; }
  .membre { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 8px; border-radius: 9px; font-size: 13px; }
  .membre:hover { background: var(--tint-orange); }
  .membre .n { font-weight: 700; } .membre .f { grid-column: 1; color: var(--text-muted); font-size: 12px; }
  .membre.chef .n::before { content: '★ '; color: var(--orange-main); }
  .membre a.tel { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 12px; font-weight: 700; color: var(--orange-main); text-decoration: none; white-space: nowrap; }
  .membre.cache { display: none; }
  .vide-o { padding: 16px; color: var(--text-muted); }
</style>
</head>
<body>
<header class="bandeau"><div class="bandeau-inner">
  <div class="logo-area"><div class="logo-circle">IN</div>
    <div class="logo-text"><h1>Organigramme</h1><p>Division Infrastructure — RNS · mis à jour depuis BDDORGA</p></div></div>
  <div class="bandeau-droite"><a class="btn-ghost" id="l-aff" href="affectation.html" style="text-decoration:none" hidden>🔀 Affectations</a><a class="btn-ghost" href="portail.html" style="text-decoration:none">← Retour au portail</a></div>
</div></header>
<div id="demo" class="demo-banner" hidden>MODE DÉMO — données fictives</div>

<main class="portail">
  <div class="barre-o">
    <input type="text" id="q" placeholder="Rechercher un nom, une fonction, un service…" autocomplete="off" aria-label="Rechercher">
    <div class="legende" id="leg"></div>
    <button class="btn-s" id="tout" type="button">Tout déplier</button>
  </div>
  <div id="racine"></div>
  <div class="grille-s" id="services"></div>
  <p class="aide" id="aide" style="margin-top:14px"></p>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/employeurs.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (Api.demo) $('demo').hidden = false;
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function telSur(t) { return String(t || '').replace(/[^\d+]/g, ''); }
  var D = null, ouvert = true;

  function membre(m) {
    var d = el('div', 'membre' + (m.chef ? ' chef' : '')); d.dataset.t = norm(m.nom + ' ' + m.fonction);
    var n = el('div', 'n', m.nom); var pe = Employeur.pastille(m.dependance); if (pe) { pe.style.marginLeft = '8px'; n.appendChild(pe); }
    d.appendChild(n); d.appendChild(el('div', 'f', m.fonction || '—'));
    var t = telSur(m.telephone); if (t) { var a = el('a', 'tel', '📞 ' + m.telephone); a.href = 'tel:' + t; d.appendChild(a); }
    return d;
  }
  function bloc(s, racine) {
    var det = el(racine ? 'div' : 'details', racine ? 'racine' : 'svc'); det.dataset.t = norm(s.nom);
    var titre = el(racine ? 'h2' : 'summary'); titre.appendChild(el('span', null, (racine ? '🏛️ ' : '') + s.nom)); titre.appendChild(el('small', null, s.membres.length + ' pers.'));
    if (racine) { titre.style.cssText = 'display:flex;justify-content:space-between;font-size:16px;margin:0 0 6px'; }
    det.appendChild(titre); var c = el('div', 'corps'); s.membres.forEach(function (m) { c.appendChild(membre(m)); }); det.appendChild(c);
    if (!racine) det.open = true; return det;
  }
  function dessiner() {
    var r = $('racine'), g = $('services'); r.textContent = ''; g.textContent = '';
    D.services.forEach(function (s) { (s.racine ? r : g).appendChild(bloc(s, s.racine)); });
    var cpt = {}; D.services.forEach(function (s) { s.membres.forEach(function (m) { var k = (m.dependance || 'SONATRACH').toUpperCase(); cpt[k] = (cpt[k] || 0) + 1; }); });
    var lg = $('leg'); lg.textContent = ''; Object.keys(cpt).sort().forEach(function (k) { var sp = el('span'); var p = Employeur.pastille(k); if (p) { p.style.marginLeft = '0'; sp.appendChild(p); } else sp.appendChild(document.createTextNode(k)); sp.appendChild(document.createTextNode(' ' + cpt[k])); lg.appendChild(sp); });
    $('aide').textContent = D.total + ' personne(s) · ★ responsable du service · organigramme calculé à partir de BDDORGA (service, fonction, employeur, téléphone) : un changement d\'affectation s\'y reflète aussitôt.';
    filtrer();
  }
  function filtrer() {
    var f = norm($('q').value);
    document.querySelectorAll('.svc, .racine').forEach(function (b) {
      var serviceOk = !f || b.dataset.t.indexOf(f) !== -1, vus = 0;
      b.querySelectorAll('.membre').forEach(function (m) { var ok = serviceOk || m.dataset.t.indexOf(f) !== -1; m.classList.toggle('cache', !ok); if (ok) vus += 1; });
      b.style.display = vus ? '' : 'none'; if (f && b.tagName === 'DETAILS') b.open = true;
    });
  }
  $('q').addEventListener('input', filtrer);
  $('tout').addEventListener('click', function () { ouvert = !ouvert; document.querySelectorAll('details.svc').forEach(function (d) { d.open = ouvert; }); $('tout').textContent = ouvert ? 'Tout replier' : 'Tout déplier'; });
  $('tout').textContent = 'Tout replier';

  Api.call('organigramme').then(function (r) { D = r; dessiner(); })
    .catch(function (e) {
      if (e.code === 'SESSION' || (!Api.token() && !Api.demo)) { Api.setToken(''); location.replace('connexion.html'); return; }
      if (e.code === 'DROITS') { location.replace('portail.html'); return; }
      $('services').appendChild(el('div', 'vide-o', '⚠ ' + e.message + (/inconnue/i.test(e.message) ? ' (la passerelle n\'est pas encore à jour : attendez la fin du déploiement)' : '')));
    });
  // Lien vers les affectations pour qui y a droit
  Api.call('menu').then(function (r) { var m = (r.menu || []).filter(function (x) { return x.id === 'affectation'; })[0]; if (m && m.niveau >= 2) $('l-aff').hidden = false; }).catch(function () {});
})();
</script>
<script src="js/pied.js"></script>
</body>
</html>
