// ─────────────────────────────────────────────

  { nom: "Mosquée", type: "boq", service: "Construction", actif: false, csvUrl: "" },

  { nom: "Prestation Génie Civil", type: "workforce", service: "Construction", actif: false,

  // ── SERVICE TRAVAUX ENTRETIEN — ACTIF ──────────────────────
  // Forage RNS et Terrassement RNS sont des exemples-types de fiches suiveuses.

  // type "itemized" = lit directement l'onglet "Tableau de Bord" source et en extrait
  // le tableau de cumul par item contractuel (un poste par ligne BPU, avec son propre %)

    csvUrl: "https://docs.google.com/spreadsheets/d/1_bL3vv2dtYJWmvs0ZqZqq2agACVEZdAr14UP2unoUhM/export?format=csv&gid=2117456852" },

  // ── SERVICE ÉLECTROMÉCANIQUE — ACTIF (liens à venir) ────────
  // Ajouter ici les fiches suiveuses au fur et à mesure qu'elles arrivent.
  { nom: "Maintenance des Installations Électriques", type: "electrique", service: "Électromécanique", actif: true,

    csvUrl: "https://docs.google.com/spreadsheets/d/1Pk0n5UNT8yf5A7yZNe8rwHyevn7XHsB4/export?format=csv&gid=627222972" },
  { nom: "Travaux de maintenance des installations de froid et climatisation", type: "boq", service: "Électromécanique", actif: true, csvUrl: "" },

// ─────────────────────────────────────────────
// Utilitaires
// ─────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (field !== '' || row.length) { row.push(field); rows.push(row); row = []; field = ''; }
        if (c === '\r' && next === '\n') i++;
      } else field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ''));
}

function parseNumberFR(str) {
  if (!str) return 0;
  const cleaned = str.toString().replace(/\s/g, '').replace('%', '').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function formatDA(n) { return Math.round(n).toLocaleString('fr-FR').replace(/,/g, ' ') + ' DA'; }
function formatM3(n) { return Math.round(n).toLocaleString('fr-FR').replace(/,/g, ' ') + ' m³'; }

function statusBadge(pct) {
  if (pct >= 70) return '<span class="badge-status badge-ontrack">Bien avancé</span>';
  if (pct >= 20) return '<span class="badge-status badge-late">En cours</span>';
  return '<span class="badge-status badge-start">Démarrage</span>';
}

function escapeHtml(str) {
  return (str || '').toString()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function fetchCSV(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) throw new Error('fetch failed (' + res.status + '): ' + url);
    const text = await res.text();
    return parseCSV(text);
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('délai dépassé (12s) — le lien ne répond pas : ' + url);
    throw e;
  } finally {
    clearTimeout(timeout);
  }
}

// ─────────────────────────────────────────────
// Intégration CPM — recensement automatique des projets "Contrat en exécution"
// Lecture SEULE du CSV public de Suivi CPM (Dossiers_CPM.html n'est pas modifié).
// Colonnes ajoutées à la fin du sheet CPM, sans toucher aux colonnes déjà
// utilisées ailleurs :
//   AG (index 32) = Service            (ex: "Service Construction")
//   AH (index 33) = Nature du contrat  (ex: "Travaux", "Prestation")
// ─────────────────────────────────────────────
const CPM_CSV_URL = "https://docs.google.com/spreadsheets/d/1QFoEEsoosl3vGdwyAlzmQbHt3Vv76llfWfrO-prmAuY/export?format=csv&gid=1963142469";
const COL_CPM = { INTITULE: 3, STATUT: 8, N_CONTRAT: 13, DATE_ODS: 16, DUREE_CONTRAT: 17, ECHEANCE: 18, SERVICE: 32, NATURE: 33 };
const SERVICES_ORDRE = ["Construction", "Travaux Entretien", "Électromécanique", "Autre"];

function normalizeTxt(str) {
  return (str || '').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function normalizeNom(str) { return normalizeTxt(str).replace(/[^a-z0-9]+/g, ' ').trim(); }

// Même parseur de date FR (JJ/MM/AAAA) que Dossiers_CPM.html, pour rester cohérent
// avec le calcul du délai déjà utilisé là-bas.
function parseFrDate(str) {
  if (!str) return null;
  const parts = str.trim().split('/');
  if (parts.length !== 3) return null;
  const d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
  if (!d || !m || !y || y < 1990) return null;
  const dt = new Date(y, m - 1, d);
  return isNaN(dt.getTime()) ? null : dt;
}

// Nettoie un montant écrit "41 491 564" ou "10 481 190 DA" -> nombre JS
function parseMontantFr(str) {
  if (!str) return 0;
  const cleaned = str.toString().replace(/DA/gi, '').replace(/[^\d,.\-]/g, '');
  const num = parseFloat(cleaned.replace(',', '.'));
  return isNaN(num) ? 0 : num;
}

function mapServiceCPM(raw) {
  const s = normalizeTxt(raw);
  if (s.includes('electromecanique')) return 'Électromécanique';
  if (s.includes('entretien')) return 'Travaux Entretien';
  if (s.includes('construction')) return 'Construction';
  return 'Autre';
}

// Renvoie les dossiers CPM en "Contrat en exécution" qui n'ont pas encore de
// fiche suiveuse branchée (csvUrl) dans CHANTIERS, groupés par service.
async function loadCPMEnPrevision() {
  const rows = await fetchCSV(CPM_CSV_URL);

  // Repère la ligne d'en-têtes dynamiquement (même logique que Dossiers_CPM.html)
  // pour ne pas dépendre d'un nombre fixe de lignes de titre dans le sheet.
  let headerIdx = rows.findIndex(r => r.some(cell => normalizeTxt(cell) === 'statut'));
  if (headerIdx === -1) headerIdx = 1;
  const data = rows.slice(headerIdx + 1);

  // Dossiers déjà suivis avec un vrai lien -> déjà affichés normalement ailleurs
  // sur la page, on les exclut du recensement pour ne pas les dupliquer.
  const nomsDejaBranches = new Set(
    CHANTIERS.filter(c => c.csvUrl && c.csvUrl.trim() !== '').map(c => normalizeNom(c.nom))
  );

  const vus = new Set();
  const resultat = [];
  data.forEach(r => {
    const intitule = (r[COL_CPM.INTITULE] || '').trim();
    const statut = r[COL_CPM.STATUT] || '';
    if (!intitule || !normalizeTxt(statut).includes('execution')) return;

    const key = normalizeNom(intitule);
    if (nomsDejaBranches.has(key) || vus.has(key)) return;
    vus.add(key);

    resultat.push({
      nom: intitule,

// ─────────────────────────────────────────────
// Chargement — type "electrique" (contrat de fournitures avec stock)
// Jauge globale = moyenne de :
//   1) % délai consommé du contrat (calculé depuis le dossier CPM correspondant,
//      même formule que Dossiers_CPM.html : (aujourd'hui - date ODS) / (échéance - date ODS))
//   2) % de consommation du marché, lu directement dans la cellule
//      "📈 AVANCEMENT GLOBAL" de l'onglet "Tableau de bord" du sheet source
// ─────────────────────────────────────────────
async function loadElectrique(chantier) {
  const rows = await fetchCSV(chantier.csvUrl);
  // Détection dynamique de la ligne d'en-têtes du bloc "tableau de bord" (plutôt qu'un
  // numéro de ligne fixe) : robuste si des lignes vides sont filtrées ou si la mise en
  // page du sheet change légèrement.
  const headerRowIdx = rows.findIndex(r => r.some(cell => normalizeTxt(cell).includes('avancement global')));
  const headerRow = headerRowIdx !== -1 ? rows[headerRowIdx] : [];
  const valueRow = headerRowIdx !== -1 ? (rows[headerRowIdx + 1] || []) : [];
  const colAvancement = headerRow.findIndex(c => normalizeTxt(c).includes('avancement global'));
  const colMontantTotal = headerRow.findIndex(c => normalizeTxt(c).includes('montant total'));
  const colMontantLivre = headerRow.findIndex(c => normalizeTxt(c).includes('montant livr'));
  const pctConso = colAvancement !== -1 ? (parseFloat((valueRow[colAvancement] || '').replace('%', '').replace(',', '.').trim()) || 0) : 0;
  const montantTotal = colMontantTotal !== -1 ? parseMontantFr(valueRow[colMontantTotal]) : 0;
  const montantLivre = colMontantLivre !== -1 ? parseMontantFr(valueRow[colMontantLivre]) : 0;

  let pctDelai = null;
  let delaiMotif = null;
  try {
    const cpmRows = await fetchCSV(CPM_CSV_URL);
    let headerIdx = cpmRows.findIndex(r => r.some(cell => normalizeTxt(cell) === 'statut'));
    if (headerIdx === -1) headerIdx = 1;
    const data = cpmRows.slice(headerIdx + 1);
    const targetKey = normalizeTxt(chantier.nContrat).replace(/[^a-z0-9]/g, '');
    const match = data.find(r => normalizeTxt(r[COL_CPM.N_CONTRAT] || '').replace(/[^a-z0-9]/g, '') === targetKey);
    if (!match) {
      delaiMotif = `Dossier CPM introuvable (n° contrat recherché : ${chantier.nContrat})`;
    } else {
      // Date ODS = date de départ du décompte du délai. Si absente dans le CPM, on utilise
      // une date de secours saisie manuellement dans la config (chantier.delaiManuel), en
      // attendant que la case "Date ODS" soit remplie côté Suivi CPM.
      let dateODS = parseFrDate(match[COL_CPM.DATE_ODS]);
      let dureeMois = parseFloat((match[COL_CPM.DUREE_CONTRAT] || '').toString().replace(',', '.')) || null;
      if (!dateODS && chantier.delaiManuel && chantier.delaiManuel.dateDebut) {
        dateODS = parseFrDate(chantier.delaiManuel.dateDebut);
        if (chantier.delaiManuel.dureeMois) dureeMois = chantier.delaiManuel.dureeMois;
      }
      let echeanceDate = parseFrDate(match[COL_CPM.ECHEANCE]);
      if (!echeanceDate && dateODS && dureeMois) {
        echeanceDate = new Date(dateODS);
        echeanceDate.setMonth(echeanceDate.getMonth() + Math.round(dureeMois));
      }
      if (dateODS && echeanceDate) {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const totalJours = Math.round((echeanceDate - dateODS) / (1000 * 60 * 60 * 24));
        const joursRestants = Math.round((echeanceDate - today) / (1000 * 60 * 60 * 24));
        if (totalJours > 0) {
          const elapsedJours = totalJours - joursRestants;
          pctDelai = Math.max(0, Math.min(100, Math.round((elapsedJours / totalJours) * 100)));
        }
      } else {
        delaiMotif = "Dossier CPM trouvé, mais la Date ODS (et/ou l'Échéance) n'est pas renseignée — à compléter dans Suivi CPM";
      }
    }
  } catch (e) { delaiMotif = "Suivi CPM injoignable pour le moment"; }

  const pctGlobal = pctDelai !== null ? (pctConso + pctDelai) / 2 : pctConso;

  return {
    type: 'electrique', service: chantier.service, nom: chantier.nom,
    pct: pctGlobal, pctGlobal, pctConso, pctDelai, delaiMotif,
    montantTotal, montantLivre
  };
}

// ─────────────────────────────────────────────
// Utilitaire commun : repère une cellule par son libellé (insensible aux accents/casse)
// ─────────────────────────────────────────────
function normalizeAccents(s) {
  return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function findHeaderRow(rows, mustContainAll) {
  for (let r = 0; r < rows.length; r++) {
    const norm = rows[r].map(normalizeAccents);
    if (mustContainAll.every(needle => norm.some(cell => cell.includes(needle)))) {
      return r;
    }
  }
  return -1;
}

// ─────────────────────────────────────────────
// Chargement — type "multiwell" (tableau "SYNTHÈSE MULTI-PUITS" : un poste par puits)
// Colonnes attendues : Code Puits | Destination/Usage | Profondeur | Budget Engagé (HT)
//                       | Montant Réalisé (HT) | % Avancement | Statut Opérationnel
// ─────────────────────────────────────────────
async function loadMultiwell(chantier) {
  const rows = await fetchCSV(chantier.csvUrl);
  const hIdx = findHeaderRow(rows, ['code puits', 'destination']);
  if (hIdx === -1) throw new Error('Tableau multi-puits introuvable dans : ' + chantier.nom);
  const header = rows[hIdx].map(normalizeAccents);
  const col = {
    code: header.findIndex(h => h.includes('code puits')),
    dest: header.findIndex(h => h.includes('destination')),
    budget: header.findIndex(h => h.includes('budget')),
    realise: header.findIndex(h => h.includes('montant realise') || h.includes('realise')),
    pct: header.findIndex(h => h.includes('avancement')),
    statut: header.findIndex(h => h.includes('statut')),
  };
  const lignes = [];
  for (let r = hIdx + 1; r < rows.length; r++) {
    const codeCell = (rows[r][col.code] || '').trim();
    if (!codeCell) break;
    if (normalizeAccents(codeCell) === 'total') break;
    const montantPrevu = parseNumberFR(rows[r][col.budget]);
    if (montantPrevu <= 0) continue;
    const montantRealise = parseNumberFR(rows[r][col.realise]);
    const pct = parseNumberFR(rows[r][col.pct]);
    const statut = (rows[r][col.statut] || '').trim();
    const dest = (rows[r][col.dest] || '').trim();
    lignes.push({
      designation: `${codeCell} — ${dest}${statut ? ' (' + statut + ')' : ''}`,
      unite: '%', qtePrevue: 100, qteRealisee: pct, montantPrevu, montantRealise, pct,
    });
  }
  const totalPrevu = lignes.reduce((s, l) => s + l.montantPrevu, 0);
  const totalRealise = lignes.reduce((s, l) => s + l.montantRealise, 0);
  return {
    nom: chantier.nom, type: 'boq', service: chantier.service || '', lignes, totalPrevu, totalRealise,
    pct: totalPrevu > 0 ? (totalRealise / totalPrevu) * 100 : 0,
  };
}

// ─────────────────────────────────────────────
// Chargement — type "itemized" (tableau "CUMUL PAR ITEM CONTRACTUEL" : un poste par ligne BPU)
// Colonnes attendues : Item | Désignation des Travaux | Unité | Qté Contrat | Prix Unitaire
//                       | Qté Consommée Cumulée | Montant Consommé HT | Qté Restante | % Consommé
// ─────────────────────────────────────────────
async function loadItemized(chantier) {
  const rows = await fetchCSV(chantier.csvUrl);
  const hIdx = findHeaderRow(rows, ['designation', 'prix unitaire']);
  if (hIdx === -1) throw new Error('Tableau par item introuvable dans : ' + chantier.nom);
  const header = rows[hIdx].map(normalizeAccents);
  const col = {
    item: header.findIndex(h => h.includes('item')),
    desig: header.findIndex(h => h.includes('designation')),
    unite: header.findIndex(h => h === 'unite' || h.includes('unite')),
    qteContrat: header.findIndex(h => h.includes('qte contrat')),
    pu: header.findIndex(h => h.includes('prix unitaire')),
    montantConso: header.findIndex(h => h.includes('montant consomme')),
    pctConso: header.findIndex(h => h.includes('% consomme') || h.includes('consomme')),
  };
  const lignes = [];
  for (let r = hIdx + 1; r < rows.length; r++) {
    const desig = (rows[r][col.desig] || '').trim();
    if (!desig) continue;
    if (normalizeAccents(desig).includes('total general')) break;
    const qteContrat = parseNumberFR(rows[r][col.qteContrat]);
    const pu = parseNumberFR(rows[r][col.pu]);
    const montantPrevu = qteContrat * pu;
    if (montantPrevu <= 0) continue;
    const montantRealise = parseNumberFR(rows[r][col.montantConso]);
    lignes.push({
      designation: desig.length > 70 ? desig.slice(0, 67) + '…' : desig,
      unite: (rows[r][col.unite] || '').trim(), qtePrevue: qteContrat,
      qteRealisee: pu > 0 ? montantRealise / pu : 0, montantPrevu, montantRealise,
      pct: montantPrevu > 0 ? Math.min(100, (montantRealise / montantPrevu) * 100) : 0,
    });
  }
  const totalPrevu = lignes.reduce((s, l) => s + l.montantPrevu, 0);
  const totalRealise = lignes.reduce((s, l) => s + l.montantRealise, 0);
  return {
    nom: chantier.nom, type: 'boq', service: chantier.service || '', lignes, totalPrevu, totalRealise,
    pct: totalPrevu > 0 ? (totalRealise / totalPrevu) * 100 : 0,
  };
}

// ─────────────────────────────────────────────
// Chargement — type "workforce" (suivi main d'œuvre / matériel en jours,
// pas de % financier — ex. pointage Génie Civil)
// ─────────────────────────────────────────────
async function loadWorkforce(chantier) {
  const rows = await fetchCSV(chantier.csvUrl);
  // ── Tableau 1 : Effectifs et jours de présence par mois ──
  const hdr1Idx = rows.findIndex(r => (r[0] || '').trim() === 'Mois');
  const total1Idx = rows.findIndex(r => (r[0] || '').trim().toUpperCase().startsWith('TOTAL'));
  const totalRow = total1Idx >= 0 ? rows[total1Idx] : null;
  const nbMois = hdr1Idx >= 0 && total1Idx >= 0 ? (total1Idx - hdr1Idx - 1) : 8;
  const totalPresence = totalRow ? parseNumberFR(totalRow[6]) : 0;
  const totalRepos = totalRow ? parseNumberFR(totalRow[7]) : 0;
  const effectifTotalCumule = totalRow ? parseNumberFR(totalRow[3]) : 0;
  const effectifMoyen = nbMois > 0 ? effectifTotalCumule / nbMois : 0;

  const parMois = [];
  if (hdr1Idx >= 0 && total1Idx > hdr1Idx) {
    for (let i = hdr1Idx + 1; i < total1Idx; i++) {
      const r = rows[i];
      if (!r || !r[0]) continue;
      parMois.push({
        mois: r[0].trim(), effectif: parseNumberFR(r[3]),
        presence: parseNumberFR(r[6]), repos: parseNumberFR(r[7]),
      });
    }
  }

  // ── Tableau 2 : Suivi matériel — jours d'utilisation par mois ──
  const hdr2Idx = rows.findIndex(r => (r[0] || '').trim() === 'Engin');
  const materielRow = rows.filter(r => (r[0] || '').trim().toUpperCase() === 'TOTAL').pop();
  const totalMateriel = materielRow ? parseNumberFR(materielRow[materielRow.length - 1]) : 0;
  const materielParMois = [];
  if (hdr2Idx >= 0 && materielRow) {
    const moisLabels = rows[hdr2Idx].slice(1, -1); // exclut 'Engin' et 'Total annuel'
    moisLabels.forEach((label, idx) => {
      materielParMois.push({ mois: (label || '').trim(), jours: parseNumberFR(materielRow[idx + 1]) });
    });
  }

  return { nom: chantier.nom, type: 'workforce', service: chantier.service || '',
    totalPresence, totalRepos, effectifMoyen, totalMateriel, parMois, materielParMois };
}

  const showLabel = big;
  return `<div class="gauge-h-bg" style="height:${height}px;">
      <div class="gauge-h-fill" style="width:${Math.min(100, Math.max(0, pct))}%;background:${fillColor};"></div>
      ${showLabel ? `<div class="gauge-h-label">${pct.toFixed(1)}%</div>` : ''}
    </div>`;
}

      <div class="chantier-head"><h3>${data.nom} <span class="badge-unit">Journal (m³)</span> ${statusBadge(data.pct)}</h3>
        <div style="display:flex;align-items:center;gap:10px"><span class="chantier-pct">${data.pct.toFixed(0)}%</span><span class="chevron">▾</span></div></div>
      <div class="chantier-bar-bg"><div class="chantier-bar-fill" style="width:${data.pct}%"></div></div>
      <div class="chantier-meta"><span>Réalisé total : ${formatM3(data.totalRealise)} / ${formatM3(data.totalPrevu)}</span><span>Dernière saisie : ${data.date || '—'}</span></div>
      <div class="lines-wrap">${sub}</div></div>`;
}

function renderChantierCardWorkforce(data, i) {
  const rowsPresence = (data.parMois || []).map(m => `
    <tr><td>${m.mois}</td><td>${m.effectif}</td><td>${m.presence.toLocaleString('fr-FR')}</td><td>${m.repos.toLocaleString('fr-FR')}</td></tr>`).join('');
  const rowsMateriel = (data.materielParMois || []).map(m => `
    <tr><td>${m.mois}</td><td>${m.jours.toLocaleString('fr-FR')}</td></tr>`).join('');
  const tableStyle = 'width:100%;border-collapse:collapse;font-size:12px;';
  const thStyle = 'text-align:left;padding:6px 8px;color:var(--text-muted);font-weight:600;border-bottom:1px solid var(--border);';
  const tdStyle = 'padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text-dark);';
  const detail = `
    <div style="margin-top:16px;">
      <div style="font-size:12px;font-weight:700;color:var(--gray-dark);margin-bottom:8px;">Détail mensuel — effectifs & présence</div>
      <table style="${tableStyle}"><thead><tr>
        <th style="${thStyle}">Mois</th><th style="${thStyle}">Effectif</th><th style="${thStyle}">Jours présence</th><th style="${thStyle}">Jours repos</th>
      </tr></thead><tbody>${rowsPresence.replace(/<td>/g, `<td style="${tdStyle}">`)}</tbody></table>
    </div>
    <div style="margin-top:16px;">
      <div style="font-size:12px;font-weight:700;color:var(--gray-dark);margin-bottom:8px;">Détail mensuel — matériel (jours d'utilisation, tous engins)</div>
      <table style="${tableStyle}"><thead><tr>
        <th style="${thStyle}">Mois</th><th style="${thStyle}">Jours matériel</th>
      </tr></thead><tbody>${rowsMateriel.replace(/<td>/g, `<td style="${tdStyle}">`)}</tbody></table>
    </div>`;
  return `<div class="chantier-card" id="card-${i}" onclick="toggleCard(${i})">
      <div class="chantier-head"><h3>${data.nom} <span class="badge-unit" style="background:#F0FDF4;color:#15803D;">Suivi main d'œuvre — jours</span></h3>
        <span class="chevron">▾</span></div>
      <div class="chantier-meta" style="margin-top:12px;gap:22px;">
        <span>Effectif moyen : <b>${data.effectifMoyen.toFixed(0)}</b></span>
        <span>Jours présence cumulés : <b>${data.totalPresence.toLocaleString('fr-FR')}</b></span>
        <span>Jours repos cumulés : <b>${data.totalRepos.toLocaleString('fr-FR')}</b></span>
        <span>Jours matériel cumulés : <b>${data.totalMateriel.toLocaleString('fr-FR')}</b></span>
      </div>
      <div class="lines-wrap">${detail}</div>
    </div>`;
}

// ─────────────────────────────────────────────
// computeStats() — calcule toutes les données (chantiers + CPM), sans toucher au DOM.
// Isolé de init() exprès : index.html peut charger ce fichier et appeler cette
// fonction directement pour récupérer exactement les mêmes chiffres (même source
// de vérité), sans dupliquer la liste des chantiers ni la logique de calcul.
// ─────────────────────────────────────────────
async function computeStats() {
  const active = CHANTIERS.filter(c => c.actif !== false && c.csvUrl && c.csvUrl.trim() !== '');
  const [settled, cpmSettled] = await Promise.all([
    Promise.allSettled(active.map(c => {
      if (c.type === 'journal') return loadChantierJournal(c);
      if (c.type === 'portfolio') return loadPortfolio(c);
      if (c.type === 'multiwell') return loadMultiwell(c);
      if (c.type === 'itemized') return loadItemized(c);
      if (c.type === 'workforce') return loadWorkforce(c);
      if (c.type === 'electrique') return loadElectrique(c);
      return loadChantierBOQ(c);
    })),
    // Le recensement CPM ne doit jamais bloquer le reste : en cas d'échec on renvoie juste 0 résultat.
    loadCPMEnPrevision().catch(() => [])
  ]);
  const cpmEnPrevision = cpmSettled;

  const failed = [];
  const loaded = settled.map((s, i) => {
    if (s.status === 'fulfilled') return s.value;
    failed.push({ nom: active[i].nom, error: s.reason && s.reason.message ? s.reason.message : String(s.reason) });
    return null;
  }).filter(v => v !== null);
  // "portfolio" renvoie un tableau de chantiers : on aplatit tout en une seule liste
  const results = loaded.flat();

  const boqResults = results.filter(r => r.type === 'boq' && r.service !== 'Travaux Entretien');
  const journalResults = results.filter(r => r.type === 'journal');
  const kpiResults = results.filter(r => r.service === 'Travaux Entretien');
  const workforceResults = results.filter(r => r.type === 'workforce');
  const electriqueResults = results.filter(r => r.type === 'electrique');
  // Avancement global : services actifs (Travaux Entretien + Électromécanique) — le Service
  // Construction (boq/journal/portfolio + Génie Civil) est exclu tant qu'il est en pause.
  const globalResults = results.filter(r => r.service === 'Travaux Entretien' || r.service === 'Électromécanique');
  const globalPct = globalResults.length > 0 ? globalResults.reduce((s, r) => s + r.pct, 0) / globalResults.length : 0;
  const electroPct = electriqueResults.length > 0 ? electriqueResults.reduce((s, r) => s + r.pct, 0) / electriqueResults.length : 0;
  const kpiPct = kpiResults.length > 0 ? kpiResults.reduce((s, r) => s + r.pct, 0) / kpiResults.length : 0;

  return { results, boqResults, journalResults, kpiResults, workforceResults, electriqueResults, globalResults, globalPct, electroPct, kpiPct, cpmEnPrevision, failed };
}

function toggleCard(i) { document.getElementById('card-' + i).classList.toggle('open'); }

async function init() {
  const content = document.getElementById('content');
  try {
    const { results, boqResults, journalResults, kpiResults, workforceResults, electriqueResults, globalResults, globalPct, electroPct, kpiPct, cpmEnPrevision, failed } = await computeStats();

    let html = `<div class="section-title">Vue globale</div>`;

    if (boqResults.length > 0) {
      const totalPrevu = boqResults.reduce((s, r) => s + r.totalPrevu, 0);
      const totalRealise = boqResults.reduce((s, r) => s + r.totalRealise, 0);
      html += `<div class="section-title" style="margin-top:0"><span class="unit-tag">Chantiers en bordereau — DA</span></div>
        <div class="stats-row">
          <div class="stat-card"><div class="lbl">Montant prévu</div><div class="val">${formatDA(totalPrevu)}</div></div>
          <div class="stat-card realise"><div class="lbl">Montant réalisé</div><div class="val">${formatDA(totalRealise)}</div></div>
          <div class="stat-card rar"><div class="lbl">Reste à réaliser</div><div class="val">${formatDA(totalPrevu-totalRealise)}</div></div>
        </div>`;
    }
    if (journalResults.length > 0) {
      const totalPrevu = journalResults.reduce((s, r) => s + r.totalPrevu, 0);
      const totalRealise = journalResults.reduce((s, r) => s + r.totalRealise, 0);
      html += `<div class="section-title"><span class="unit-tag">Chantiers en volumes — m³</span></div>
        <div class="stats-row">
          <div class="stat-card"><div class="lbl">Volume prévu</div><div class="val">${formatM3(totalPrevu)}</div></div>
          <div class="stat-card realise"><div class="lbl">Volume réalisé</div><div class="val">${formatM3(totalRealise)}</div></div>
          <div class="stat-card rar"><div class="lbl">Reste à réaliser</div><div class="val">${formatM3(totalPrevu-totalRealise)}</div></div>
        </div>`;
    }
    if (kpiResults.length > 0) {
      const totalPrevu = kpiResults.reduce((s, r) => s + r.totalPrevu, 0);
      const totalRealise = kpiResults.reduce((s, r) => s + r.totalRealise, 0);
      html += `<div class="section-title"><span class="unit-tag">Service Travaux Entretien — DZD</span></div>
        <div class="stats-row">
          <div class="stat-card"><div class="lbl">Budget contractuel</div><div class="val">${formatDA(totalPrevu)}</div></div>
          <div class="stat-card realise"><div class="lbl">Cumul réalisé</div><div class="val">${formatDA(totalRealise)}</div></div>
          <div class="stat-card rar"><div class="lbl">Reste à réaliser</div><div class="val">${formatDA(totalPrevu-totalRealise)}</div></div>
        </div>`;
    }

    html += `<div class="global-card">
        <div class="global-info">
          <h3>Projets & Prestations — Division Infra</h3>
          ${renderGaugeH(globalPct, { big: true })}
          <div class="sub">${globalResults.length} prestation${globalResults.length > 1 ? 's' : ''} suivie${globalResults.length > 1 ? 's' : ''} — Travaux Entretien + Électromécanique (Service Construction en pause, exclu de ce calcul)</div>
        </div>
      </div>
      <div class="section-title">Avancement global par service</div>
      <div class="service-grid">
        <div class="service-card disabled">
          <h4>🏗️ Service Construction <span class="svc-badge pause">En pause</span></h4>
          ${renderGaugeH(0, { big: false, color: '#D1D5DB' })}
          <div class="svc-note">Chantiers gelés temporairement — données conservées dans le fichier, exclues du calcul global. Reprise ultérieure.</div>
        </div>
        <div class="service-card">
          <h4>🚧 Service Travaux Entretien <span class="svc-badge active">Actif</span></h4>
          ${renderGaugeH(kpiPct, { big: false })}
          <div class="svc-pct">${kpiPct.toFixed(1)}%</div>
          <div class="svc-note">${kpiResults.length} prestation${kpiResults.length > 1 ? 's' : ''} suivie${kpiResults.length > 1 ? 's' : ''}</div>
        </div>
        ${electriqueResults.length > 0 ? `
        <div class="service-card">
          <h4>🔧 Service Électromécanique <span class="svc-badge active">Actif</span></h4>
          ${renderGaugeH(electroPct, { big: false })}
          <div class="svc-pct">${electroPct.toFixed(1)}%</div>
          <div class="svc-note">${electriqueResults.length} prestation${electriqueResults.length > 1 ? 's' : ''} suivie${electriqueResults.length > 1 ? 's' : ''}</div>
        </div>` : `
        <div class="service-card disabled">
          <h4>🔧 Service Électromécanique <span class="svc-badge empty">À venir</span></h4>
          ${renderGaugeH(0, { big: false, color: '#D1D5DB' })}
          <div class="svc-note">Aucune fiche suiveuse renseignée pour l'instant — ajoutée dès réception.</div>
        </div>`}
      </div>`;

    html += renderPrevisionSection(cpmEnPrevision);

    const infraResults = results.filter(r => (r.type === 'boq' || r.type === 'journal') && r.service !== 'Travaux Entretien');
    if (infraResults.length > 0 || workforceResults.length > 0) {
      html += `<div class="section-title">Détail par chantier — Service Génie Civil</div>`;
      html += infraResults.map((r, i) => r.type === 'journal' ? renderChantierCardJournal(r, results.indexOf(r)) : renderChantierCardBOQ(r, results.indexOf(r))).join('');
      html += workforceResults.map(r => renderChantierCardWorkforce(r, results.indexOf(r))).join('');
    }

    if (kpiResults.length > 0) {
      html += `<div class="section-title">Détail par chantier — Service Travaux Entretien</div>`;
      html += kpiResults.map(r => renderChantierCardKPI(r, results.indexOf(r))).join('');
    }

    if (electriqueResults.length > 0) {
      html += `<div class="section-title">Détail par chantier — Service Électromécanique</div>`;
      html += electriqueResults.map(r => renderChantierCardElectrique(r, results.indexOf(r))).join('');
    }

    if (failed.length > 0) {
      html += `<div class="section-title">⚠️ Chantiers non chargés</div>
        <div class="error-box" style="text-align:left;background:#FEF2F2;border-radius:14px;border:1px solid #FECACA;padding:16px 20px;">
          ${failed.map(f => `<div style="margin-bottom:8px;"><b>${f.nom}</b> — <span style="font-size:12px">${f.error}</span></div>`).join('')}
        </div>`;
    }

    content.className = '';
    content.innerHTML = html;
  } catch (e) {
    content.className = 'error-box';
    content.innerHTML = "Impossible de charger les données. Vérifie ta connexion internet ou que les liens Google Sheets sont bien publiés.<br><br><small>" + e.message + "</small>";
  }
}
init();
</script>
