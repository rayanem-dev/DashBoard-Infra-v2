<script>
// ─────────────────────────────────────────────
// CHANTIERS : dynamiques. La liste vient de « Affectation chantier » (un chantier par contrat en exécution du Suivi CPM,
// avec son service) ; l'avancement vient des rapports journaliers ou, si le chantier a une fiche suiveuse, de cette fiche.
// TRACKERS = les fiches suiveuses connues (choix « Suivi » dans Affectation chantier).
// ─────────────────────────────────────────────
const TRACKERS = {
  forage: { nom: "Forage RNS — 3 puits d'eau", type: "multiwell", csvUrl: "forage" },
  terrassement: { nom: "Terrassement RNS (36 mois)", type: "itemized", csvUrl: "terrassement" },
  electricite: { nom: "Maintenance des Installations Électriques", type: "electrique", csvUrl: "electricite" }
};
// Tant que le choix « Suivi » n'est pas fait dans Affectation chantier, ces trois contrats gardent leur fiche d'origine.
const SUIVI_DEFAUT = { '30.INFRA.24': 'electricite', '53.INFRA.25': 'terrassement', '72.INFRA.25': 'forage' };
function suiviDe(c) { return c.suivi || SUIVI_DEFAUT[String(c.contrat || '').toUpperCase()] || ''; }

// ─────────────────────────────────────────────
// Utilitaires
// ─────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (field !== '' || row.length) { row.push(field); rows.push(row); row = []; field = ''; }
        if (c === '\r' && next === '\n') i++;
      } else field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ''));
}

function parseNumberFR(str) {
  if (!str) return 0;
  const cleaned = str.toString().replace(/\s/g, '').replace('%', '').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function formatDA(n) { return Math.round(n).toLocaleString('fr-FR').replace(/,/g, ' ') + ' DA'; }
function formatM3(n) { return Math.round(n).toLocaleString('fr-FR').replace(/,/g, ' ') + ' m³'; }

function statusBadge(pct) {
  if (pct >= 70) return '<span class="badge-status badge-ontrack">Bien avancé</span>';
  if (pct >= 20) return '<span class="badge-status badge-late">En cours</span>';
  return '<span class="badge-status badge-start">Démarrage</span>';
}

function escapeHtml(str) {
  return (str || '').toString()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Les feuilles ne sont plus lues directement : la passerelle les lit pour nous (source = « forage », « cpm »…), après vérification des droits.
async function fetchCSV(source) {
  try {
    return parseCSV(await Donnees.csv(source));
  } catch (e) {
    if (e && e.code === 'SESSION') { location.replace('connexion.html'); }
    throw e;
  }
}

// ─────────────────────────────────────────────
// Intégration CPM — recensement automatique des projets "Contrat en exécution"
// Lecture SEULE du CSV public de Suivi CPM (Dossiers_CPM.html n'est pas modifié).
// Colonnes ajoutées à la fin du sheet CPM, sans toucher aux colonnes déjà
// utilisées ailleurs :
//   AG (index 32) = Service            (ex: "Service Construction")
//   AH (index 33) = Nature du contrat  (ex: "Travaux", "Prestation")
// ─────────────────────────────────────────────
const CPM_CSV_URL = "cpm"; // source lue par la passerelle (js/donnees.js)
const COL_CPM = { INTITULE: 3, STATUT: 8, N_CONTRAT: 13, DATE_ODS: 16, DUREE_CONTRAT: 17, ECHEANCE: 18, SERVICE: 32, NATURE: 33 };
const SERVICES_ORDRE = ["Construction", "Travaux Entretien", "Électromécanique", "Autre"];

function normalizeTxt(str) {
  return (str || '').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function normalizeNom(str) { return normalizeTxt(str).replace(/[^a-z0-9]+/g, ' ').trim(); }

// Même parseur de date FR (JJ/MM/AAAA) que Dossiers_CPM.html, pour rester cohérent
// avec le calcul du délai déjà utilisé là-bas.
function parseFrDate(str) {
  if (!str) return null;
  const parts = str.trim().split('/');
  if (parts.length !== 3) return null;
  const d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
  if (!d || !m || !y || y < 1990) return null;
  const dt = new Date(y, m - 1, d);
  return isNaN(dt.getTime()) ? null : dt;
}

// Nettoie un montant écrit "41 491 564" ou "10 481 190 DA" -> nombre JS
function parseMontantFr(str) {
  if (!str) return 0;
  const cleaned = str.toString().replace(/DA/gi, '').replace(/[^\d,.\-]/g, '');
  const num = parseFloat(cleaned.replace(',', '.'));
  return isNaN(num) ? 0 : num;
}

function mapServiceCPM(raw) {
  const s = normalizeTxt(raw);
  if (s.includes('electromecanique')) return 'Électromécanique';
  if (s.includes('entretien')) return 'Travaux Entretien';
  if (s.includes('construction')) return 'Construction';
  return 'Autre';
}

// ─────────────────────────────────────────────
// Chargement — type "electrique" (contrat de fournitures avec stock)
// Jauge globale = moyenne de :
//   1) % délai consommé du contrat (calculé depuis le dossier CPM correspondant,
//      même formule que Dossiers_CPM.html : (aujourd'hui - date ODS) / (échéance - date ODS))
//   2) % de consommation du marché, lu directement dans la cellule
//      "📈 AVANCEMENT GLOBAL" de l'onglet "Tableau de bord" du sheet source
// ─────────────────────────────────────────────
async function loadElectrique(chantier) {
  const rows = await fetchCSV(chantier.csvUrl);
  // Détection dynamique de la ligne d'en-têtes du bloc "tableau de bord" (plutôt qu'un
  // numéro de ligne fixe) : robuste si des lignes vides sont filtrées ou si la mise en
  // page du sheet change légèrement.
  const headerRowIdx = rows.findIndex(r => r.some(cell => normalizeTxt(cell).includes('avancement global')));
  const headerRow = headerRowIdx !== -1 ? rows[headerRowIdx] : [];
  const valueRow = headerRowIdx !== -1 ? (rows[headerRowIdx + 1] || []) : [];
  const colAvancement = headerRow.findIndex(c => normalizeTxt(c).includes('avancement global'));
  const colMontantTotal = headerRow.findIndex(c => normalizeTxt(c).includes('montant total'));
  const colMontantLivre = headerRow.findIndex(c => normalizeTxt(c).includes('montant livr'));
  const pctConso = colAvancement !== -1 ? (parseFloat((valueRow[colAvancement] || '').replace('%', '').replace(',', '.').trim()) || 0) : 0;
  const montantTotal = colMontantTotal !== -1 ? parseMontantFr(valueRow[colMontantTotal]) : 0;
  const montantLivre = colMontantLivre !== -1 ? parseMontantFr(valueRow[colMontantLivre]) : 0;

  let pctDelai = null;
  let delaiMotif = null;
  try {
    const cpmRows = await fetchCSV(CPM_CSV_URL);
    let headerIdx = cpmRows.findIndex(r => r.some(cell => normalizeTxt(cell) === 'statut'));
    if (headerIdx === -1) headerIdx = 1;
    const data = cpmRows.slice(headerIdx + 1);
    const targetKey = normalizeTxt(chantier.nContrat).replace(/[^a-z0-9]/g, '');
    const match = data.find(r => normalizeTxt(r[COL_CPM.N_CONTRAT] || '').replace(/[^a-z0-9]/g, '') === targetKey);
    if (!match) {
      delaiMotif = `Dossier CPM introuvable (n° contrat recherché : ${chantier.nContrat})`;
    } else {
      // Date ODS = date de départ du décompte du délai. Si absente dans le CPM, on utilise
      // une date de secours saisie manuellement dans la config (chantier.delaiManuel), en
      // attendant que la case "Date ODS" soit remplie côté Suivi CPM.
      let dateODS = parseFrDate(match[COL_CPM.DATE_ODS]);
      let dureeMois = parseFloat((match[COL_CPM.DUREE_CONTRAT] || '').toString().replace(',', '.')) || null;
      if (!dateODS && chantier.delaiManuel && chantier.delaiManuel.dateDebut) {
        dateODS = parseFrDate(chantier.delaiManuel.dateDebut);
        if (chantier.delaiManuel.dureeMois) dureeMois = chantier.delaiManuel.dureeMois;
      }
      let echeanceDate = parseFrDate(match[COL_CPM.ECHEANCE]);
      if (!echeanceDate && dateODS && dureeMois) {
        echeanceDate = new Date(dateODS);
        echeanceDate.setMonth(echeanceDate.getMonth() + Math.round(dureeMois));
      }
      if (dateODS && echeanceDate) {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const totalJours = Math.round((echeanceDate - dateODS) / (1000 * 60 * 60 * 24));
        const joursRestants = Math.round((echeanceDate - today) / (1000 * 60 * 60 * 24));
        if (totalJours > 0) {
          const elapsedJours = totalJours - joursRestants;
          pctDelai = Math.max(0, Math.min(100, Math.round((elapsedJours / totalJours) * 100)));
        }
      } else {
        delaiMotif = "Dossier CPM trouvé, mais la Date ODS (et/ou l'Échéance) n'est pas renseignée — à compléter dans Suivi CPM";
      }
    }
  } catch (e) { delaiMotif = "Suivi CPM injoignable pour le moment"; }

  const pctGlobal = pctDelai !== null ? (pctConso + pctDelai) / 2 : pctConso;

  return {
    type: 'electrique', service: chantier.service, nom: chantier.nom,
    pct: pctGlobal, pctGlobal, pctConso, pctDelai, delaiMotif,
    montantTotal, montantLivre
  };
}

// ─────────────────────────────────────────────
// Chargement — type "boq"
// ─────────────────────────────────────────────
async function loadChantierBOQ(chantier) {
  const rows = await fetchCSV(chantier.csvUrl);
  const header = rows[0].map(h => h.trim());
  const idx = {
    designation: header.indexOf('Designation'), unite: header.indexOf('Unite'),
    qtePrevue: header.indexOf('Qte_Prevue'), montantPrevu: header.indexOf('Montant_Prevu'),
    qteRealisee: header.indexOf('Qte_Realisee'), montantRealise: header.indexOf('Montant_Realise'),
  };
  const lignes = rows.slice(1).map(r => {
    const montantPrevu = parseNumberFR(r[idx.montantPrevu]);
    const montantRealise = parseNumberFR(r[idx.montantRealise]);
    return {
      designation: (r[idx.designation] || '').trim(), unite: (r[idx.unite] || '').trim(),
      qtePrevue: parseNumberFR(r[idx.qtePrevue]), montantPrevu,
      qteRealisee: parseNumberFR(r[idx.qteRealisee]), montantRealise,
      pct: montantPrevu > 0 ? Math.min(100, (montantRealise / montantPrevu) * 100) : 0,
    };
  }).filter(l => l.designation && l.montantPrevu > 0);

  const totalPrevu = lignes.reduce((s, l) => s + l.montantPrevu, 0);
  const totalRealise = lignes.reduce((s, l) => s + l.montantRealise, 0);
  return { nom: chantier.nom, type: 'boq', service: chantier.service || '', lignes, totalPrevu, totalRealise, pct: totalPrevu > 0 ? (totalRealise / totalPrevu) * 100 : 0 };
}

// ─────────────────────────────────────────────
// Chargement — type "journal" (suivi quotidien en volumes)
// ─────────────────────────────────────────────
async function loadChantierJournal(chantier) {
  const rows = await fetchCSV(chantier.csvUrl);
  const header = rows[0].map(h => h.trim());
  const idx = {
    date: header.indexOf('Date'), pfRealise: header.indexOf('PF_Realise'), pfPrevu: header.indexOf('PF_Prevu'),
    pfTaux: header.indexOf('PF_Taux'), talusRealise: header.indexOf('Talus_Realise'), talusPrevu: header.indexOf('Talus_Prevu'),
    talusTaux: header.indexOf('Talus_Taux'), totalRealise: header.indexOf('Total_Realise'),
    totalPrevu: header.indexOf('Total_Prevu'), tauxGlobal: header.indexOf('Taux_Global'),
  };
  const r = rows[1];
  return {
    nom: chantier.nom, type: 'journal', date: (r[idx.date] || '').trim(),
    pfRealise: parseNumberFR(r[idx.pfRealise]), pfPrevu: parseNumberFR(r[idx.pfPrevu]), pfTaux: parseNumberFR(r[idx.pfTaux]),
    talusRealise: parseNumberFR(r[idx.talusRealise]), talusPrevu: parseNumberFR(r[idx.talusPrevu]), talusTaux: parseNumberFR(r[idx.talusTaux]),
    totalRealise: parseNumberFR(r[idx.totalRealise]), totalPrevu: parseNumberFR(r[idx.totalPrevu]), pct: parseNumberFR(r[idx.tauxGlobal]),
  };
}

async function loadPortfolio(chantier) {

  const idx = { nom: header.indexOf('Nom'), montantPrevu: header.indexOf('Montant_Prevu'), montantRealise: header.indexOf('Montant_Realise') };
  return rows.slice(1).map(r => {
    const totalPrevu = parseNumberFR(r[idx.montantPrevu]);
    const totalRealise = parseNumberFR(r[idx.montantRealise]);
    return {
      nom: (r[idx.nom] || '').trim(), type: 'boq',
      lignes: [{ designation: 'Ensemble des travaux', unite: 'FF', qtePrevue: 1, montantPrevu: totalPrevu,
                 qteRealisee: totalPrevu > 0 ? totalRealise / totalPrevu : 0, montantRealise: totalRealise,
                 pct: totalPrevu > 0 ? Math.min(100, (totalRealise / totalPrevu) * 100) : 0 }],
      totalPrevu, totalRealise, pct: totalPrevu > 0 ? (totalRealise / totalPrevu) * 100 : 0,
    };
  }).filter(c => c.nom && c.totalPrevu > 0);
}

// ─────────────────────────────────────────────
// Utilitaire commun : repère une cellule par son libellé (insensible aux accents/casse)
// ─────────────────────────────────────────────
function normalizeAccents(s) {
  return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function findHeaderRow(rows, mustContainAll) {
  for (let r = 0; r < rows.length; r++) {
    const norm = rows[r].map(normalizeAccents);
    if (mustContainAll.every(needle => norm.some(cell => cell.includes(needle)))) {
      return r;
    }
  }
  return -1;
}

// ─────────────────────────────────────────────
// Chargement — type "multiwell" (tableau "SYNTHÈSE MULTI-PUITS" : un poste par puits)
// Colonnes attendues : Code Puits | Destination/Usage | Profondeur | Budget Engagé (HT)
//                       | Montant Réalisé (HT) | % Avancement | Statut Opérationnel
// ─────────────────────────────────────────────
async function loadMultiwell(chantier) {
  const rows = await fetchCSV(chantier.csvUrl);
  const hIdx = findHeaderRow(rows, ['code puits', 'destination']);
  if (hIdx === -1) throw new Error('Tableau multi-puits introuvable dans : ' + chantier.nom);
  const header = rows[hIdx].map(normalizeAccents);
  const col = {
    code: header.findIndex(h => h.includes('code puits')),
    dest: header.findIndex(h => h.includes('destination')),
    budget: header.findIndex(h => h.includes('budget')),
    realise: header.findIndex(h => h.includes('montant realise') || h.includes('realise')),
    pct: header.findIndex(h => h.includes('avancement')),
    statut: header.findIndex(h => h.includes('statut')),
  };
  const lignes = [];
  for (let r = hIdx + 1; r < rows.length; r++) {
    const codeCell = (rows[r][col.code] || '').trim();
    if (!codeCell) break;
    if (normalizeAccents(codeCell) === 'total') break;
    const montantPrevu = parseNumberFR(rows[r][col.budget]);
    if (montantPrevu <= 0) continue;
    const montantRealise = parseNumberFR(rows[r][col.realise]);
    const pct = parseNumberFR(rows[r][col.pct]);
    const statut = (rows[r][col.statut] || '').trim();
    const dest = (rows[r][col.dest] || '').trim();
    lignes.push({
      designation: `${codeCell} — ${dest}${statut ? ' (' + statut + ')' : ''}`,
      unite: '%', qtePrevue: 100, qteRealisee: pct, montantPrevu, montantRealise, pct,
    });
  }
  const totalPrevu = lignes.reduce((s, l) => s + l.montantPrevu, 0);
  const totalRealise = lignes.reduce((s, l) => s + l.montantRealise, 0);
  return {
    nom: chantier.nom, type: 'boq', service: chantier.service || '', lignes, totalPrevu, totalRealise,
    pct: totalPrevu > 0 ? (totalRealise / totalPrevu) * 100 : 0,
  };
}

// ─────────────────────────────────────────────
// Chargement — type "itemized" (tableau "CUMUL PAR ITEM CONTRACTUEL" : un poste par ligne BPU)
// Colonnes attendues : Item | Désignation des Travaux | Unité | Qté Contrat | Prix Unitaire
//                       | Qté Consommée Cumulée | Montant Consommé HT | Qté Restante | % Consommé
// ─────────────────────────────────────────────
async function loadItemized(chantier) {
  const rows = await fetchCSV(chantier.csvUrl);
  const hIdx = findHeaderRow(rows, ['designation', 'prix unitaire']);
  if (hIdx === -1) throw new Error('Tableau par item introuvable dans : ' + chantier.nom);
  const header = rows[hIdx].map(normalizeAccents);
  const col = {
    item: header.findIndex(h => h.includes('item')),
    desig: header.findIndex(h => h.includes('designation')),
    unite: header.findIndex(h => h === 'unite' || h.includes('unite')),
    qteContrat: header.findIndex(h => h.includes('qte contrat')),
    pu: header.findIndex(h => h.includes('prix unitaire')),
    montantConso: header.findIndex(h => h.includes('montant consomme')),
    pctConso: header.findIndex(h => h.includes('% consomme') || h.includes('consomme')),
  };
  const lignes = [];
  for (let r = hIdx + 1; r < rows.length; r++) {
    const desig = (rows[r][col.desig] || '').trim();
    if (!desig) continue;
    if (normalizeAccents(desig).includes('total general')) break;
    const qteContrat = parseNumberFR(rows[r][col.qteContrat]);
    const pu = parseNumberFR(rows[r][col.pu]);
    const montantPrevu = qteContrat * pu;
    if (montantPrevu <= 0) continue;
    const montantRealise = parseNumberFR(rows[r][col.montantConso]);
    lignes.push({
      designation: desig.length > 70 ? desig.slice(0, 67) + '…' : desig,
      unite: (rows[r][col.unite] || '').trim(), qtePrevue: qteContrat,
      qteRealisee: pu > 0 ? montantRealise / pu : 0, montantPrevu, montantRealise,
      pct: montantPrevu > 0 ? Math.min(100, (montantRealise / montantPrevu) * 100) : 0,
    });
  }
  const totalPrevu = lignes.reduce((s, l) => s + l.montantPrevu, 0);
  const totalRealise = lignes.reduce((s, l) => s + l.montantRealise, 0);
  return {
    nom: chantier.nom, type: 'boq', service: chantier.service || '', lignes, totalPrevu, totalRealise,
    pct: totalPrevu > 0 ? (totalRealise / totalPrevu) * 100 : 0,
  };
}

// ─────────────────────────────────────────────
// Chargement — type "workforce" (suivi main d'œuvre / matériel en jours,
// pas de % financier — ex. pointage Génie Civil)
// ─────────────────────────────────────────────
async function loadWorkforce(chantier) {
  const rows = await fetchCSV(chantier.csvUrl);
  // ── Tableau 1 : Effectifs et jours de présence par mois ──
  const hdr1Idx = rows.findIndex(r => (r[0] || '').trim() === 'Mois');
  const total1Idx = rows.findIndex(r => (r[0] || '').trim().toUpperCase().startsWith('TOTAL'));
  const totalRow = total1Idx >= 0 ? rows[total1Idx] : null;
  const nbMois = hdr1Idx >= 0 && total1Idx >= 0 ? (total1Idx - hdr1Idx - 1) : 8;
  const totalPresence = totalRow ? parseNumberFR(totalRow[6]) : 0;
  const totalRepos = totalRow ? parseNumberFR(totalRow[7]) : 0;
  const effectifTotalCumule = totalRow ? parseNumberFR(totalRow[3]) : 0;
  const effectifMoyen = nbMois > 0 ? effectifTotalCumule / nbMois : 0;

  const parMois = [];
  if (hdr1Idx >= 0 && total1Idx > hdr1Idx) {
    for (let i = hdr1Idx + 1; i < total1Idx; i++) {
      const r = rows[i];
      if (!r || !r[0]) continue;
      parMois.push({
        mois: r[0].trim(), effectif: parseNumberFR(r[3]),
        presence: parseNumberFR(r[6]), repos: parseNumberFR(r[7]),
      });
    }
  }

  // ── Tableau 2 : Suivi matériel — jours d'utilisation par mois ──
  const hdr2Idx = rows.findIndex(r => (r[0] || '').trim() === 'Engin');
  const materielRow = rows.filter(r => (r[0] || '').trim().toUpperCase() === 'TOTAL').pop();
  const totalMateriel = materielRow ? parseNumberFR(materielRow[materielRow.length - 1]) : 0;
  const materielParMois = [];
  if (hdr2Idx >= 0 && materielRow) {
    const moisLabels = rows[hdr2Idx].slice(1, -1); // exclut 'Engin' et 'Total annuel'
    moisLabels.forEach((label, idx) => {
      materielParMois.push({ mois: (label || '').trim(), jours: parseNumberFR(materielRow[idx + 1]) });
    });
  }

  return { nom: chantier.nom, type: 'workforce', service: chantier.service || '',
    totalPresence, totalRepos, effectifMoyen, totalMateriel, parMois, materielParMois };
}

// ─────────────────────────────────────────────
// computeStats() — calcule toutes les données (chantiers + CPM), sans toucher au DOM.
// Isolé de init() exprès : index.html peut charger ce fichier et appeler cette
// fonction directement pour récupérer exactement les mêmes chiffres (même source
// de vérité), sans dupliquer la liste des chantiers ni la logique de calcul.
// ─────────────────────────────────────────────
function chargerFiche(tr) {
  if (tr.type === 'journal') return loadChantierJournal(tr);
  if (tr.type === 'multiwell') return loadMultiwell(tr);
  if (tr.type === 'itemized') return loadItemized(tr);
  if (tr.type === 'electrique') return loadElectrique(tr);
  return loadChantierBOQ(tr);
}
// Carte « rapports journaliers » : avancement déclaré par le dernier rapport, délai consommé du contrat (Suivi CPM).
function chantierDyn(c) {
  return { type: 'dyn', nom: c.nom, service: c.service || 'Sans service', contrat: c.contrat, entreprise: c.entreprise, pct: c.avancement, delai: c.delai_pct, joursRestants: c.jours_restants,
    echeance: c.echeance, montant: c.montant, dernier: c.dernier, rapports7j: c.rapports_7j };
}
async function computeStats() {
  const t = await Api.call('chantiers_tableau');
  const liste = t.chantiers || [];
  const failed = [];
  const results = await Promise.all(liste.map(async c => {
    const k = suiviDe(c);
    if (!TRACKERS[k]) return chantierDyn(c);
    const tr = Object.assign({}, TRACKERS[k], { service: c.service || 'Sans service', nom: c.nom, nContrat: c.contrat });
    try { return Object.assign(await chargerFiche(tr), { contrat: c.contrat, entreprise: c.entreprise }); }
    catch (e) { failed.push({ nom: c.nom, error: e && e.message ? e.message : String(e) }); return chantierDyn(c); }
  }));
  // Avancement connu = fiche suiveuse ou au moins un rapport journalier ; un chantier sans rapport n'entre pas dans les moyennes.
  const globalResults = results.filter(r => typeof r.pct === 'number');
  const moyenne = l => l.length ? l.reduce((s, r) => s + r.pct, 0) / l.length : 0;
  const globalPct = moyenne(globalResults);
  const kpiResults = results.filter(r => r.type === 'boq');
  return { results, globalResults, globalPct, kpiResults, moyenne, failed };
}

    .filter(Boolean).map(x => `<span>${x}</span>`).join('');
  return `<div class="chantier-card" id="card-${i}"${lignes ? ` onclick="toggleCard(${i})"` : ''}>
      <div class="chantier-head"><h3>${escapeHtml(d.nom)} <span class="badge-unit">Rapports journaliers</span> ${known ? statusBadge(pct) : ''}</h3>
        <div style="display:flex;align-items:center;gap:10px"><span class="chantier-pct">${known ? pct.toFixed(0) + '%' : '—'}</span>${lignes ? '<span class="chevron">▾</span>' : ''}</div></div>
      <div class="chantier-bar-bg"><div class="chantier-bar-fill" style="width:${pct}%"></div></div>
      ${delai}
      <div class="chantier-meta">${meta}</div>
      ${lignes ? `<div class="lines-wrap">${lignes}</div>` : ''}</div>`;
}

const SERVICES_CONNUS = ['Construction', 'Travaux Entretien', 'Électromécanique'];
const ICONES_SERVICE = { 'Construction': '🏗️', 'Travaux Entretien': '🚧', 'Électromécanique': '🔧' };

async function init() {
  const content = document.getElementById('content');
  try {
    const { results, globalResults, globalPct, kpiResults, moyenne, failed } = await computeStats();
    if (!results.length) {
      content.className = 'error-box';
      content.innerHTML = 'Aucun chantier pour l\'instant. Ouvrez « Affectation chantier » puis « Synchroniser avec le Suivi CPM » : un chantier est créé pour chaque contrat en exécution.';
      return;
    }

    let html = `<div class="section-title">Vue globale</div>`;
    if (kpiResults.length > 0) {
      const totalPrevu = kpiResults.reduce((s, r) => s + r.totalPrevu, 0);
      const totalRealise = kpiResults.reduce((s, r) => s + r.totalRealise, 0);
      html += `<div class="section-title" style="margin-top:0"><span class="unit-tag">Chantiers suivis par fiche — DA</span></div>
        <div class="stats-row">
          <div class="stat-card"><div class="lbl">Budget contractuel</div><div class="val">${formatDA(totalPrevu)}</div></div>
          <div class="stat-card realise"><div class="lbl">Cumul réalisé</div><div class="val">${formatDA(totalRealise)}</div></div>
          <div class="stat-card rar"><div class="lbl">Reste à réaliser</div><div class="val">${formatDA(totalPrevu-totalRealise)}</div></div>
        </div>`;
    }

    // Services : ceux d'Affectation chantier, dans l'ordre habituel puis les autres.
    const vus = [...new Set(results.map(r => r.service))];
    const services = SERVICES_CONNUS.filter(x => vus.includes(x)).concat(vus.filter(x => !SERVICES_CONNUS.includes(x)));
    html += `<div class="global-card">
        <div class="global-info">
          <h3>Projets & Prestations — Division Infra</h3>
          ${renderGaugeH(globalPct, { big: true })}
          <div class="sub">${globalResults.length} chantier${globalResults.length > 1 ? 's' : ''} avec avancement connu sur ${results.length} en cours (fiche suiveuse ou rapport journalier) — un chantier sans rapport n'entre pas dans la moyenne</div>
        </div>
      </div>
      <div class="section-title">Avancement global par service</div>
      <div class="service-grid">${services.map(sv => {
        const du = results.filter(r => r.service === sv), connus = du.filter(r => typeof r.pct === 'number'), m = moyenne(connus);
        return connus.length ? `<div class="service-card">
          <h4>${ICONES_SERVICE[sv] || '📁'} ${escapeHtml(sv)} <span class="svc-badge active">${du.length} chantier${du.length > 1 ? 's' : ''}</span></h4>
          ${renderGaugeH(m, { big: false })}
          <div class="svc-pct">${m.toFixed(1)}%</div>
          <div class="svc-note">${connus.length} chantier${connus.length > 1 ? 's' : ''} avec avancement connu</div></div>` : `<div class="service-card disabled">
          <h4>${ICONES_SERVICE[sv] || '📁'} ${escapeHtml(sv)} <span class="svc-badge empty">${du.length} chantier${du.length > 1 ? 's' : ''}</span></h4>
          ${renderGaugeH(0, { big: false, color: '#D1D5DB' })}
          <div class="svc-note">Aucun rapport journalier reçu pour l'instant.</div></div>`;
      }).join('')}
      </div>`;

    services.forEach(sv => {
      html += `<div class="section-title">Détail par chantier — ${escapeHtml(sv)}</div>`;
      html += results.filter(r => r.service === sv).map(r => {
        const i = results.indexOf(r);
        return r.type === 'dyn' ? renderChantierCardDyn(r, i) : r.type === 'electrique' ? renderChantierCardElectrique(r, i) : renderChantierCardKPI(r, i);
      }).join('');
    });

    if (failed.length > 0) {
      html += `<div class="section-title">⚠️ Fiches non chargées (le chantier est affiché d'après ses rapports journaliers)</div>
        <div class="error-box" style="text-align:left;background:#FEF2F2;border-radius:14px;border:1px solid #FECACA;padding:16px 20px;">
          ${failed.map(f => `<div style="margin-bottom:8px;"><b>${escapeHtml(f.nom)}</b> — <span style="font-size:12px">${escapeHtml(f.error)}</span></div>`).join('')}
        </div>`;
    }

    content.className = '';
    content.innerHTML = html;
  } catch (e) {
    content.className = 'error-box';
    content.innerHTML = "Impossible de charger les chantiers.<br><br><small>" + escapeHtml(e.message) + "</small>";
  }
}
init();
</script>
<script src="js/pied.js"></script>
<script src="js/raccourcis.js"></script>
</body>
</html>
