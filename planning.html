<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Planning &amp; rotations – Division Infrastructure RNS</title>
<meta name="theme-color" content="#E85D04">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/charte.css">
</head>
<body>
<header class="bandeau"><div class="bandeau-inner">
  <div class="logo-area"><div class="logo-circle">SH</div>
    <div class="logo-text"><h1 id="titre">Planning &amp; rotations</h1><p>Sonatrach · RNS · Travail / repos</p></div></div>
  <div class="bandeau-droite"><a class="btn-ghost" href="portail.html" style="text-decoration:none">← Retour au portail</a></div>
</div></header>
<div id="demo" class="demo-banner" hidden>MODE DÉMO — données fictives</div>

<main class="portail">
  <div class="titre-impression"><h1 id="t-imp">Planning & rotations</h1><p id="s-imp"></p></div>
  <div id="bandeau-modif" class="no-print" role="status"></div>
  <div class="stats" id="stats"></div>
  <div class="barre" id="barre-vue">
    <div class="vues" role="group" aria-label="Vue" id="vues">
      <button data-v="1">Mois</button><button data-v="3">3 mois</button><button data-v="6">6 mois</button><button data-v="12">1 an</button>
    </div>
    <div class="nav-periode"><button class="btn-s" id="prec" type="button" aria-label="Période précédente">‹</button><b id="periode"></b><button class="btn-s" id="suiv" type="button" aria-label="Période suivante">›</button><button class="btn-s" id="auj" type="button">Aujourd'hui</button></div>
    <button class="btn no-print" id="modif-moi" type="button" hidden style="margin-top:0;padding:8px 16px;width:auto">✏️ Modifier mon planning</button>
    <button class="btn-s no-print" id="imprimer" type="button" title="Imprimer ou enregistrer en PDF">🖨 Imprimer / PDF</button>
    <div class="legende"><span><i style="background:var(--c-T)"></i>Travail</span><span><i style="background:var(--c-R)"></i>Repos</span><span><i style="background:var(--c-ABS)"></i>Absence</span><span><i style="background:var(--c-T-prevu);border:1px solid #BFE3B1"></i><i style="background:var(--c-R-prevu);border:1px solid #F4C3A5"></i>Prévu (à venir)</span><span><i style="background:#B91C1C;height:4px;vertical-align:3px"></i>Férié national</span><span><i style="background:#047857;height:4px;vertical-align:3px"></i>Férié religieux</span></div>
  </div>
  <div class="barre" id="barre-filtres" hidden>
    <input type="text" id="q" placeholder="Rechercher un nom…" aria-label="Rechercher">
    <details class="svc" id="svc"><summary id="svc-resume">Services</summary><div class="liste" id="svc-liste"></div></details>
    <select id="emp" aria-label="Employeur"><option value="">Tous les employeurs</option></select>
    <div class="legende" id="leg-emp" style="margin-left:0"></div>
    <select id="etat" aria-label="Situation"><option value="">Toutes les situations</option><option value="T">Au travail</option><option value="R">En repos</option><option value="N">Non configurés</option></select>
  </div>
  <section class="panneau" style="padding:0">
    <div class="defile" style="overflow:auto;max-height:70vh"><table class="plan2" id="tab"></table></div>
  </section>
  <p class="aide" id="aide" style="margin-top:12px"></p>
</main>
<footer class="pied"><a id="sijil" href="https://rayanem-dev.github.io/pointage-app/" target="_blank" rel="noopener" title="Sijil — gestion des pointages et des rotations"><img src="img/sijil-symbole.png" alt="" width="16" height="16"><span>Propulsé par <b>Sijil</b></span></a></footer>
<div class="toast" id="toast" role="status"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/rotation.js"></script>
<script src="js/feries.js"></script>
<script src="js/simulation.js"></script>
<script src="js/modif-planning.js"></script>
<script>Rotation.exiger();</script>
<script src="js/employeurs.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (Api.demo) $('demo').hidden = false;
  if (window.SIJIL_URL) $('sijil').href = window.SIJIL_URL;
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var MCOURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  var PX = { 1: 24, 3: 11, 6: 5.5, 12: 2.8 };   // largeur d'un jour
  var CLE_VUE = 'infra_v2_plan_vue', CLE_SVC = 'infra_v2_plan_svc_masques';
  var vue = 3, debutMois = null, data = null, masques = {};
  try { vue = Number(localStorage.getItem(CLE_VUE)) || 3; masques = JSON.parse(localStorage.getItem(CLE_SVC) || '{}'); } catch (e) {}
  if (!PX[vue]) vue = 3;

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function svgEl(tag, attrs) { var e = document.createElementNS('http://www.w3.org/2000/svg', tag); Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); }); return e; }
  function d2s(d) { return d.toISOString().slice(0, 10); }
  function s2d(s) { return new Date(s + 'T00:00:00Z'); }
  function plus(s, n) { var d = s2d(s); d.setUTCDate(d.getUTCDate() + n); return d2s(d); }
  function ecart(a, b) { return Math.round((s2d(b) - s2d(a)) / 86400000); }
  function moisPlus(s, n) { var d = s2d(s); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); return d2s(d); }
  function etatDe(l) { return !l.configuree || !l.situation || l.situation.avant ? 'N' : l.situation.statut; }
  function svc(l) { return l.service || '(sans service)'; }
  function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = 'toast'; }, 3200); }
  function court(s) { return s.slice(8) + '/' + s.slice(5, 7); }

  // ---------- Période ----------
  function bornes() { var fin = plus(moisPlus(debutMois, vue), -1); return { debut: debutMois, fin: fin, jours: ecart(debutMois, fin) + 1 }; }
  function libellePeriode() {
    var b = bornes(), d = s2d(b.debut), f = s2d(b.fin);
    if (vue === 1) return MOIS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
    return MCOURT[d.getUTCMonth()] + ' ' + d.getUTCFullYear() + ' → ' + MCOURT[f.getUTCMonth()] + ' ' + f.getUTCFullYear();
  }

  // ---------- Frise SVG : un segment par suite de jours identiques ----------
  function segments(g) { var out = [], i = 0; while (i < g.length) { var c = g.charAt(i), j = i; while (j < g.length && g.charAt(j) === c) j += 1; out.push({ c: c, a: i, n: j - i }); i = j; } return out; }
  // Palette de Sijil : jusqu'à aujourd'hui = couleur vive ; après aujourd'hui = teinte claire « prévu » (sauf absence).
  var COUL = { T: '#4EA72E', R: '#E97132', A: '#E53935' }, PREVU = { T: '#D6F0CC', R: '#FBDCC8', A: '#E53935' }, PREVU_CLAIR = { T: '#D6F0CC', R: '#FBDCC8' }, LIB = { T: 'Travail', R: 'Repos', A: 'Absence' };
  // Jours fériés (nationaux en rouge, religieux en vert) : repère en haut de chaque jour, nom dans l'infobulle de la souris
  var _fer = {}; function ferMap(debut, n) { var k = debut + '|' + n; return _fer[k] || (_fer[k] = Holidays.carte(debut, plus(debut, n))); }
  function ferCoul(h) { return h.type === 'religieuse' ? '#047857' : '#B91C1C'; }
  function infobulleJour(debut, i, etat) { var d = plus(debut, i), h = ferMap(debut, 400)[d]; return jourFr(d) + (etat ? ' — ' + etat : '') + (h ? '\n' + (h.type === 'religieuse' ? '🕌 ' : '🇩🇿 ') + h.nom : ''); }
  function frise(grille, debut, n, px, aujIdx, etiquettes) {
    // teintes « prévu » et fond selon le thème (clair / sombre)
    var cs = getComputedStyle(document.documentElement); PREVU.T = cs.getPropertyValue('--c-T-prevu').trim() || PREVU_CLAIR.T; PREVU.R = cs.getPropertyValue('--c-R-prevu').trim() || PREVU_CLAIR.R;
    var h = 20, s = svgEl('svg', { width: n * px, height: h, viewBox: '0 0 ' + (n * px) + ' ' + h, role: 'img', preserveAspectRatio: 'none' });
    s.appendChild(svgEl('rect', { x: 0, y: 4, width: n * px, height: h - 8, rx: 3, fill: '#F3F4F6', style: 'fill:' + (cs.getPropertyValue('--surface-2').trim() || '#F3F4F6') }));
    segments(grille).forEach(function (g) {
      if (!COUL[g.c]) return;
      // le segment est coupé au lendemain d'aujourd'hui : partie vive, puis partie « prévue »
      var coupe = Math.min(Math.max(aujIdx + 1, g.a), g.a + g.n);
      [[g.a, coupe, COUL], [coupe, g.a + g.n, PREVU]].forEach(function (part) {
        var de = part[0], a2 = part[1], n2 = a2 - de; if (n2 <= 0) return;
        var r = svgEl('rect', { x: de * px, y: 4, width: n2 * px - (px > 6 ? 1 : 0), height: h - 8, rx: px > 6 ? 3 : 1, fill: part[2][g.c] });
        s.appendChild(r);
      });
      // « 6 restants · → 25/10 » écrit dans la bande de la période en cours (variante la plus longue qui tient)
      if (etiquettes && aujIdx >= g.a && aujIdx < g.a + g.n) {
        var larg = g.n * px - 8, txt = etiquettes.filter(function (e) { return e.length * 5.6 <= larg; })[0];
        if (txt) { var et = svgEl('text', { x: g.a * px + 5, y: 14, 'font-size': 10.5, 'font-weight': 700, fill: '#fff', stroke: 'rgba(0,0,0,.55)', 'stroke-width': 2.4, 'paint-order': 'stroke', 'pointer-events': 'none' }); et.textContent = txt; s.appendChild(et); }
      }
      if (px >= 20) {
        for (var k = 0; k < g.n; k += 1) {
          var futur = g.a + k > aujIdx && g.c !== 'A';
          var tx = svgEl('text', { x: (g.a + k) * px + px / 2, y: 15, 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 700, fill: futur ? '#4B5563' : '#fff' });
          tx.textContent = g.c; s.appendChild(tx);
        }
      }
    });
    if (etiquettes && etiquettes.libre) { var lb = svgEl('text', { x: 6, y: 14, 'font-size': 10.5, 'font-weight': 600, fill: '#6B7280' }); lb.textContent = etiquettes[0]; s.appendChild(lb); }
    var fm = ferMap(debut, n); for (var fi = 0; fi < n; fi += 1) { var fh = fm[plus(debut, fi)]; if (fh) s.appendChild(svgEl('rect', { x: fi * px, y: 0, width: Math.max(2, px - (px > 6 ? 1 : 0)), height: 4, fill: ferCoul(fh) })); }
    if (aujIdx >= 0 && aujIdx < n) s.appendChild(svgEl('rect', { x: aujIdx * px - 1, y: 0, width: Math.max(2, px > 6 ? 2 : 1.5), height: h, fill: '#1A1A2E' }));
    Survol.attacher(s, function (x) { var i = Math.floor(x / px); if (i < 0 || i >= n) return ''; var c = grille.charAt(i); return infobulleJour(debut, i, (LIB[c] || '') + (c !== 'A' && i > aujIdx && LIB[c] ? ' (prévu)' : '')); });
    return s;
  }
  function entete(debut, n, px, aujIdx) {
    var h = 34, s = svgEl('svg', { width: n * px, height: h, viewBox: '0 0 ' + (n * px) + ' ' + h });
    for (var i = 0; i < n; i += 1) {
      var d = plus(debut, i), jour = s2d(d).getUTCDate();
      if (jour === 1 || i === 0) {
        s.appendChild(svgEl('line', { x1: i * px, y1: 0, x2: i * px, y2: h, stroke: '#D1D5DB' }));
        var m = svgEl('text', { x: i * px + 4, y: 12, 'font-size': 11, 'font-weight': 700, fill: '#374151' }); m.textContent = (vue === 1 ? MOIS[s2d(d).getUTCMonth()] : MCOURT[s2d(d).getUTCMonth()]) + (vue >= 6 && s2d(d).getUTCMonth() === 0 ? ' ' + s2d(d).getUTCFullYear() : ''); s.appendChild(m);
      }
      if (px >= 20 || (px >= 10 && (jour % 5 === 0 || jour === 1)) ) {
        var t = svgEl('text', { x: i * px + px / 2, y: 28, 'text-anchor': 'middle', 'font-size': px >= 20 ? 10 : 9, fill: i === aujIdx ? '#16598D' : '#6B7280', 'font-weight': i === aujIdx ? 700 : 400 }); t.textContent = jour; s.appendChild(t);
      }
      if (i === aujIdx) s.appendChild(svgEl('rect', { x: i * px, y: 30, width: px, height: 3, fill: '#16598D' }));
    }
    var fm = ferMap(debut, n); for (var fi = 0; fi < n; fi += 1) { var fh = fm[plus(debut, fi)]; if (fh) s.insertBefore(svgEl('rect', { x: fi * px, y: 16, width: Math.max(2, px - (px > 6 ? 1 : 0)), height: 18, fill: ferCoul(fh), opacity: .22 }), s.firstChild); }
    Survol.attacher(s, function (x) { var i = Math.floor(x / px); return i < 0 || i >= n ? '' : infobulleJour(debut, i, ''); });
    return s;
  }

  // ---------- Dessin ----------
  function stats(lignes) {
    var c = { T: 0, R: 0, N: 0 }; lignes.forEach(function (l) { c[etatDe(l)] += 1; });
    var z = $('stats'); z.textContent = '';
    if (!data.peutVoirTous) return;
    [['T', 'Au travail'], ['R', 'En repos'], ['N', 'Non configurés']].forEach(function (x) { var d = el('div', 'stat'); d.appendChild(el('b', null, String(c[x[0]]))); d.appendChild(el('span', null, x[1])); z.appendChild(d); });
  }
  function servicesVisibles(l) { return !masques[svc(l)]; }

  function dessiner() {
    var f = $('q').value.toLowerCase(), et = $('etat').value, em = $('emp').value;
    var base = data.peutVoirTous ? data.lignes.filter(servicesVisibles) : data.lignes;
    stats(base);
    var lignes = base.filter(function (l) { return (!f || (l.nom || '').toLowerCase().indexOf(f) !== -1) && (!et || etatDe(l) === et) && (!em || String(l.dependance || '').toUpperCase() === em); });
    var b = bornes(), px = PX[vue], aujIdx = ecart(b.debut, data.aujourdhui);
    var t = $('tab'); t.textContent = '';
    var hr = el('tr'); hr.appendChild(el('th', 'nom', data.peutVoirTous ? lignes.length + ' personne' + (lignes.length > 1 ? 's' : '') : 'Mon planning'));
    var th = el('th', 'frise'); th.appendChild(entete(b.debut, b.jours, px, aujIdx)); hr.appendChild(th);
    var head = el('thead'); head.appendChild(hr); t.appendChild(head);
    var body = el('tbody');
    lignes.forEach(function (l) {
      var tr = el('tr', l.moi ? 'moi' : ''); var n = el('td', 'nom'); n.title = [l.fonction, l.service].filter(Boolean).join(' · ');
      var nm = el('b', null, l.nom || ''); n.appendChild(nm);
      var pe = Employeur.pastille(l.dependance); if (pe) nm.appendChild(pe);
      Employeur.teinter(n, l.dependance);
      if (data.peutModifier && l.email) {
        var bt = el('button', 'btn-s mini no-print', '✎'); bt.title = (l.configuree ? 'Modifier le planning de ' : 'Configurer la rotation de ') + l.nom; bt.type = 'button';
        var base = function () { Rotation.ouvrir({ titre: 'Rotation de ' + l.nom, email: l.email, valeurs: l.rotation, onOk: charger }); };
        // planning déjà enregistré : le tableau « actuel / modifié » ; sinon la petite fenêtre « Où en êtes-vous ? »
        bt.addEventListener('click', function () {
          if (!l.configuree) { base(); return; }
          Api.call('modif_agent_donnees', { email: l.email }).then(function (d) { ModifPlanning.ouvrir({ donnees: d, mode: 'direct', titre: 'Planning de ' + l.nom, rotationBase: base, onChange: charger }); }).catch(function (e) { toast(e.message, true); });
        });
        n.appendChild(bt);
      }
      tr.appendChild(n);
      var s = l.situation, et = null;
      if (!l.configuree || !s) { et = ['Non configuré']; et.libre = true; }
      else if (s.avant) { et = ['Débute le ' + Rotation.frDate(s.debut)]; et.libre = true; }
      else {
        var r = s.restants + ' restant' + (s.restants > 1 ? 's' : '');
        et = [r, String(s.restants)]; // seulement « 6 restants » dans la bande
      }
      var fr = el('td', 'frise'); fr.appendChild(frise(l.grille || '', b.debut, b.jours, px, aujIdx, et)); tr.appendChild(fr);
      body.appendChild(tr);
    });
    t.appendChild(body);
    $('periode').textContent = libellePeriode();
    $('aide').textContent = 'Calculé automatiquement par le moteur de rotation de Sijil à partir de la situation déclarée de chacun. Trait noir = aujourd\'hui. Survolez une barre pour le détail.';
  }

  function services() {
    var liste = $('svc-liste'); liste.textContent = '';
    var noms = Array.from(new Set(data.lignes.map(svc))).sort();
    var outils = el('div', 'outils');
    [['Tout afficher', false], ['Tout masquer', true]].forEach(function (x) {
      var b = el('button', 'lien', x[0]); b.type = 'button'; b.style.marginTop = '0'; b.addEventListener('click', function () { noms.forEach(function (n) { masques[n] = x[1]; }); sauver(); services(); dessiner(); }); outils.appendChild(b);
    });
    liste.appendChild(outils);
    noms.forEach(function (n) {
      var nb = data.lignes.filter(function (l) { return svc(l) === n; }).length;
      var lab = el('label', 'case'); var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !masques[n];
      cb.addEventListener('change', function () { masques[n] = !cb.checked; sauver(); resume(); dessiner(); });
      lab.appendChild(cb); lab.appendChild(document.createTextNode(' ' + n + ' (' + nb + ')')); liste.appendChild(lab);
    });
    resume();
  }
  function employeurs() {
    var noms = Array.from(new Set(data.lignes.map(function (l) { return String(l.dependance || '').trim().toUpperCase(); }).filter(Boolean))).sort();
    var s = $('emp'), cur = s.value; s.length = 1;
    noms.forEach(function (n) { var o = el('option', null, n); o.value = n; s.appendChild(o); }); s.value = cur;
    s.hidden = noms.length < 2;
    var leg = $('leg-emp'); leg.textContent = '';
    noms.forEach(function (n) { var e = Employeur.pastille(n); if (e) leg.appendChild(e); });
  }
  function resume() { var noms = Array.from(new Set(data.lignes.map(svc))); var vis = noms.filter(function (n) { return !masques[n]; }).length; $('svc-resume').textContent = 'Services : ' + vis + ' / ' + noms.length; }
  function sauver() { try { localStorage.setItem(CLE_SVC, JSON.stringify(masques)); } catch (e) {} }

  // ---------- Chargement ----------
  var MOI = /[?&]moi=1(&|$)/.test(location.search); // « Mon planning » depuis la fiche du portail : seule ma ligne, même si j'ai le droit de voir les équipes
  document.addEventListener('infra-theme', function () { if (data) dessiner(); });
  $('imprimer').addEventListener('click', function () {
    $('t-imp').textContent = ($('titre').textContent || 'Planning & rotations') + ' — Division Infrastructure RNS';
    $('s-imp').textContent = ($('periode').textContent || '') + ' · imprimé le ' + new Date().toLocaleDateString('fr-FR') + (Api.demo ? ' · données fictives' : '');
    window.print();
  });
  // ---------- Modifier mon planning ----------
  function bandeauModif(d) {
    var z = $('bandeau-modif'); z.textContent = '';
    var x = d && d.derniere; if (!x) return;
    var jours = Math.round((Date.now() - Date.parse(x.decide_le || x.cree_le)) / 86400000);
    function boite(txt, cls) { var e = el('div', null, txt); e.style.cssText = 'border-radius:12px;padding:11px 14px;margin-bottom:10px;font-size:14px;line-height:1.45;' + cls; z.appendChild(e); }
    if (x.statut === 'appliquee') {
      boite('Votre demande de modification n° ' + x.numero + ' (à partir du ' + Rotation.frDate(x.debut) + ') est appliquée à votre planning ; elle attend la décision de votre chef de service, du secrétariat ou du chef de division.', 'background:var(--tint-orange);color:var(--ink-2)');
      var ann = el('button', 'btn-s', 'Annuler ma demande (retour à mon planning initial)'); ann.type = 'button'; ann.style.marginBottom = '10px';
      ann.addEventListener('click', function () { if (!confirm('Annuler votre demande n° ' + x.numero + ' ? Votre planning initial sera rétabli.')) return; ann.disabled = true;
        Api.call('modif_moi_annuler').then(function () { toast('Demande annulée : planning initial rétabli.'); charger(); }).catch(function (e) { ann.disabled = false; toast(e.message, true); }); });
      z.appendChild(ann);
      if (x.hors_rotation) boite('⚠ Vous n\'êtes pas rentré dans votre rotation à la fin de ces changements. Ce message reste affiché jusqu\'à la décision d\'un responsable.', 'background:var(--tint-err);color:var(--err);font-weight:600');
    } else if (x.statut === 'refusee' && jours <= 30) boite('Votre demande n° ' + x.numero + ' a été refusée' + (x.decide_par ? ' par ' + x.decide_par : '') + (x.commentaire ? ' — ' + x.commentaire : '') + ' : votre planning initial est rétabli.', 'background:var(--tint-err);color:var(--err)');
    else if (x.statut === 'approuvee' && jours <= 14) boite('Votre demande n° ' + x.numero + ' est validée' + (x.decide_par ? ' par ' + x.decide_par : '') + ' et transmise au secrétariat pour application.', 'background:var(--tint-ok);color:var(--ok)');
  }
  function moi() { return data && data.lignes.filter(function (l) { return l.moi; })[0]; }
  function chargerBandeau() {
    var l = moi(); $('modif-moi').hidden = !l;
    if (!l || !l.configuree) { bandeauModif(null); return; }
    Api.call('modif_moi_donnees').then(bandeauModif).catch(function () { bandeauModif(null); });
  }
  $('modif-moi').addEventListener('click', function () {
    var l = moi(); if (!l) return;
    ModifPlanning.modifierMonPlanning(l.configuree ? l.rotation : null, charger).catch(function (e) { toast(e.message, true); });
  });
  function charger() {
    var b = bornes();
    return Api.call('planning', { debut: b.debut, jours: b.jours }).then(function (r) {
      if (MOI) { r.lignes = r.lignes.filter(function (l) { return l.moi; }); r.peutVoirTous = false; }
      data = r;
      var chef = r.peutVoirTous; $('barre-filtres').hidden = !chef; $('titre').textContent = chef ? 'Planning & rotations' : 'Mon planning';
      if (chef) { services(); employeurs(); } dessiner(); chargerBandeau();
    });
  }
  function majVues() { document.querySelectorAll('#vues button').forEach(function (b) { b.classList.toggle('actif', Number(b.dataset.v) === vue); }); }
  document.querySelectorAll('#vues button').forEach(function (b) {
    b.addEventListener('click', function () { vue = Number(b.dataset.v); try { localStorage.setItem(CLE_VUE, String(vue)); } catch (e) {} majVues(); charger().catch(erreur); });
  });
  $('prec').addEventListener('click', function () { debutMois = moisPlus(debutMois, -vue); charger().catch(erreur); });
  $('suiv').addEventListener('click', function () { debutMois = moisPlus(debutMois, vue); charger().catch(erreur); });
  $('auj').addEventListener('click', function () { debutMois = moisPlus(Rotation.aujourdhui(), 0).slice(0, 8) + '01'; charger().catch(erreur); });
  ['q', 'etat', 'emp'].forEach(function (id) { $(id).addEventListener('input', function () { if (data) dessiner(); }); });
  document.addEventListener('click', function (e) { var d = $('svc'); if (d.open && !d.contains(e.target)) d.open = false; });

  function erreur(e) {
    if (e.code === 'SESSION' || (!Api.token() && !Api.demo)) { Api.setToken(''); location.replace('connexion.html'); return; }
    if (e.code === 'DROITS') { document.querySelector('main').textContent = 'Le module « Planning & rotations » n\'est pas activé pour votre compte.'; return; }
    toast(e.message, true);
  }
  debutMois = Rotation.aujourdhui().slice(0, 8) + '01'; majVues();
  charger().catch(erreur);
})();
</script>
<script src="js/pied.js"></script>
</body>
