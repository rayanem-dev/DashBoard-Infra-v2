<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Badges prestataires – Division Infrastructure RNS</title>
<meta name="theme-color" content="#E85D04">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/charte.css">
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/garde.js"></script>
</head>
<body>
<header class="bandeau"><div class="bandeau-inner">
  <div class="logo-area"><div class="logo-circle">SH</div>
    <div class="logo-text"><h1>Badges prestataires</h1><p>Sonatrach · RNS · Impression recto-verso et historique</p></div></div>
  <div class="bandeau-droite"><a class="btn-ghost" href="portail.html" style="text-decoration:none">← Retour au portail</a></div>
</div></header>
<div id="demo" class="demo-banner" hidden>MODE DÉMO — données fictives</div>
<main class="portail"><div id="app"></div></main>
<script src="badges/config.js"></script><script src="badges/badges.js"></script><script src="badges/qrcode.js"></script><script src="badges/autodetect.js"></script><script src="badges/app.js"></script>
<script>
(function () {
  if (Api.demo) document.getElementById('demo').hidden = false;
  // Le portail lit les entreprises / contrats dans le CPM et les noms / fonctions dans les Enquêtes administratives (passerelle) ; l'historique est commun à tous les utilisateurs.
  var B = window.Badges, dernier = { p: {}, e: {} };
  var CHAMPS = ['nom', 'prenom', 'fonction', 'entreprise', 'contrat', 'structure', 'nomAr', 'prenomAr', 'photo'];
  function egal(a, b) { return CHAMPS.every(function (k) { return String(a[k] || '') === String(b[k] || ''); }); }
  /** Photo de profil du portail → format du badge (22 × 28 mm, 264 × 336 px, recadrée au centre). */
  function versBadge(src) {
    return new Promise(function (ok) {
      var i = new Image(); i.onload = function () {
        var c = document.createElement('canvas'); c.width = 264; c.height = 336; var x = c.getContext('2d'), r = 264 / 336, h = i.height, w = h * r; if (w > i.width) { w = i.width; h = w / r; }
        x.fillStyle = '#fff'; x.fillRect(0, 0, 264, 336); x.drawImage(i, (i.width - w) / 2, (i.height - h) / 2, w, h, 0, 0, 264, 336); ok(c.toDataURL('image/jpeg', .85));
      }; i.onerror = function () { ok(''); }; i.src = src;
    });
  }
  /** Les personnes sans photo reçoivent automatiquement celle de leur profil, si elles ont un compte au portail (même nom) ; rien n'est enregistré tant qu'on ne modifie pas la fiche. */
  function photosProfil(personnes) {
    var sans = personnes.filter(function (p) { return !p.photo && p.nom; });
    if (!sans.length) return Promise.resolve();
    return Api.call('badges_photos_profils', { personnes: sans.slice(0, 80).map(function (p) { return { nom: p.nom, prenom: p.prenom }; }) }).then(function (r) {
      return Promise.all(sans.slice(0, 80).map(function (p, i) { var ph = (r.photos || [])[i]; return ph ? versBadge(ph).then(function (u) { if (u) { p.photo = u; p.photoProfil = true; } }) : null; }));
    });
  }
  var adaptateur = {
    nom: 'portail',
    charger: function (force) {
      return Api.call('badges_donnees', force ? { force: true } : {}).then(function (r) {
        return photosProfil(r.personnes).catch(function () { /* sans photos de profil : badges comme avant */ }).then(function () {
          dernier = { p: {}, e: {} }; r.personnes.forEach(function (p) { dernier.p[p.id] = p; }); r.entreprises.forEach(function (e) { dernier.e[B.norm(e.nom)] = e; });
          return r;
        });
      });
    },
    fonctionsEnquetes: function () { return Api.call('badges_enquetes_fonctions', {}); },
    chercherPersonnes: function (payload) { return Api.call('badges_enquetes_chercher', payload); },
    exporterEnquetes: function (payload) { return Api.call('badges_enquetes_export', payload); },
    ficheEnquetes: function (payload) { return Api.call('badges_fiche', payload); },
    majEnquetes: function (payload) { return Api.call('badges_fiche_maj', payload); },
    archiverPhoto: function (payload) { return Api.call('badges_photo_archiver', payload); },
    verifierEnquetes: function (payload) { return Api.call('badges_enquetes_verifier', payload); },
    saisirEnquetes: function (payload) { return Api.call('badges_enquetes_saisir', payload); },
    ecrirePersonnes: function (liste, x, supprimer) {
      var changes = [], supp = [], ids = {};
      liste.forEach(function (p) { ids[p.id] = 1; var o = dernier.p[p.id]; if (!o || !egal(o, p)) changes.push(p); });
      Object.keys(dernier.p).forEach(function (id) { if (!ids[id]) supp.push(id); });
      if (!changes.length && !supp.length) return Promise.resolve();
      return Api.call('badges_personnes_sauver', { personnes: changes, supprimer: supp });
    },
    ecrireEntreprises: function (liste, info) {
      var changes = [], supp = [], noms = {};
      liste.forEach(function (e) { noms[B.norm(e.nom)] = 1; var o = dernier.e[B.norm(e.nom)]; if (!o || JSON.stringify(o.contrats || []) !== JSON.stringify(e.contrats || [])) changes.push(e); });
      Object.keys(dernier.e).forEach(function (k) { if (!noms[k]) supp.push(dernier.e[k].nom); });
      if (info && info.alias) { supp = supp.filter(function (n) { return B.norm(n) !== B.norm(info.alias.de); }); }
      return Api.call('badges_entreprises_sauver', { entreprises: changes, supprimer: supp, alias: info && info.alias ? [info.alias] : [] });
    },
    numeroter: function (items, annee, cfg) {
      return Api.call('badges_numeroter', { items: items.map(function (p) { return { id: p.id, nom: p.nom, prenom: p.prenom, fonction: p.fonction, entreprise: p.entreprise, contrat: p.contrat, structure: p.structure, nomAr: p.nomAr, prenomAr: p.prenomAr, n: p.n }; }), annee: annee, reimpression: items.some(function (p) { return p.n; }),
        cfg: { base: cfg.base, formatNumero: cfg.formatNumero, chiffres: cfg.chiffres, numeroDepart: cfg.numeroDepart, structure: cfg.structure } });
    }
  };
  BadgesApp.monter(document.getElementById('app'), { adapter: adaptateur, actualiser: true, prefixe: 'badges_portail_', logoUrl: 'badges/' + (window.BADGES_CONFIG && BADGES_CONFIG.logo || 'logo-sonatrach.png') });
})();
</script>
<script src="js/pied.js"></script>
</body>
</html>
