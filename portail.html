<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portail – Division Infrastructure RNS</title>
<meta name="theme-color" content="#E85D04">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="css/charte.css">
</head>
<body>
<header class="bandeau"><div class="bandeau-inner">
  <div class="logo-area"><div class="logo-circle">SH</div>
    <div class="logo-text"><h1>Tableau de Bord – Division Infrastructure</h1><p>Sonatrach · RNS · Version 4.0 (en construction)</p></div></div>
  <div class="bandeau-droite"><span id="qui"></span><button class="btn-ghost" id="quitter" type="button">Se déconnecter</button></div>
</div></header>
<div id="demo" class="demo-banner" hidden>MODE DÉMO — données fictives</div>

<main class="portail">
  <section class="agent" id="accueil" aria-label="Ma fiche">
    <div class="agent-entete">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="agent-id">
        <p class="agent-salut" id="salut">Bonjour</p>
        <h2 id="nom-agent">Chargement…</h2>
        <p class="agent-poste" id="agent-poste"></p>
        <div class="agent-badges" id="agent-badges"></div>
      </div>
    </div>
    <div class="agent-corps">
      <div class="agent-infos" id="fiche"></div>
      <div class="jauge-bloc" id="statut" hidden>
        <div class="jauge" id="jauge" role="img" aria-label="Rotation"><div class="centre"><b id="j-reste">–</b><small id="j-lib">jours</small></div></div>
        <div class="jauge-texte">
          <span class="etat-pill" id="j-etat"></span>
          <p id="phrase"></p>
          <div class="jauge-barre" id="j-barre" aria-hidden="true"><i id="j-barre-i"></i></div>
          <p class="jauge-dates" id="j-dates"></p>
          <button class="btn-s" id="b-rot" type="button"></button>
        </div>
      </div>
    </div>
    <div class="alerte" id="alerte-mdp" hidden><span>Vous utilisez encore le mot de passe provisoire : choisissez le vôtre.</span><button class="btn-s" id="b-mdp-alerte" type="button">Changer mon mot de passe</button></div>
    <div class="agent-actions"><button class="lien" id="b-mdp" type="button">🔒 Changer mon mot de passe</button><a class="lien" id="b-oubli" href="#" hidden>✉️ Mot de passe oublié ? Demander au secrétariat</a></div>
  </section>
  <div id="modules"></div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/rotation.js"></script>
<script src="js/employeurs.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (Api.demo) $('demo').hidden = false;
  var ROLES = { agent: 'Agent', conducteur: 'Conducteur des travaux', chef_service: 'Chef de service', chef_division: 'Chef de division', secretariat: 'Secrétariat', cpm: 'Cellule Passation de marché' };
  var NIVEAUX = { 1: 'Lecture', 2: 'Saisie', 3: 'Administration' };

  function el(tag, cls, texte) { var e = document.createElement(tag); if (cls) e.className = cls; if (texte != null) e.textContent = texte; return e; }
  // N'autorise que http(s) et les pages relatives du site : jamais javascript: ni data:
  function lienSur(u) { u = String(u || ''); return /^(https?:\/\/|[A-Za-z0-9_\-\/]+\.html)/.test(u) ? u : '#'; }

  // ---------- Fiche de l'agent ----------
  function initiales(nom) { var m = String(nom || '').trim().split(/\s+/).filter(function (x) { return /[A-Za-zÀ-ÿ]/.test(x); }); return ((m[0] || '?').charAt(0) + (m[1] ? m[1].charAt(0) : '')).toUpperCase(); }
  function anciennete(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return '';
    var d = new Date(iso + 'T00:00:00'), n = new Date(); if (isNaN(d) || d > n) return '';
    var mois = (n.getFullYear() - d.getFullYear()) * 12 + n.getMonth() - d.getMonth() - (n.getDate() < d.getDate() ? 1 : 0);
    if (mois >= 12) { var an = Math.floor(mois / 12), r = mois % 12; return an + ' an' + (an > 1 ? 's' : '') + (r ? ' ' + r + ' mois' : ''); }
    if (mois >= 1) return mois + ' mois';
    var j = Math.floor((n - d) / 86400000); return j <= 0 ? 'aujourd\'hui' : j + ' jour' + (j > 1 ? 's' : '');
  }
  function dessinerFiche(u) {
    $('qui').textContent = u.nom;
    $('salut').textContent = ['Bonjour', u.civilite].filter(Boolean).join(' ');
    $('nom-agent').textContent = u.nom;
    $('agent-poste').textContent = [u.fonction, u.service].filter(Boolean).join(' · ');
    var av = $('avatar'); av.textContent = initiales(u.nom); var st = Employeur.style(u.dependance);
    av.style.background = st ? st.fond : ''; av.style.color = st ? st.texte : ''; if (st) av.style.boxShadow = '0 0 0 3px ' + st.texte + '33';
    var bd = $('agent-badges'); bd.textContent = '';
    var pe = Employeur.pastille(u.dependance); if (pe) { pe.style.marginLeft = '0'; bd.appendChild(pe); }
    bd.appendChild(el('span', 'role-pill', u.role_libelle || ROLES[u.role] || u.role || ''));
    var integ = u.date_integration ? Rotation.frDate(u.date_integration) + (anciennete(u.date_integration) ? ' · ' + anciennete(u.date_integration) : '') : '';
    var manque = [];
    function ajouter(k, lib, v, vide) { if (v) return [lib, v]; if (vide) { manque.push(k); return [lib, null]; } return null; }
    var champs = [ajouter('matricule', 'Matricule', u.matricule, true), ajouter('sap', 'Matricule SAP', u.sap, true), ajouter('nin', 'NIN', u.nin_masque, true),
      ['Identifiant SONA', u.sona], ['Wi-Fi', u.wifi_user], ['E-mail', u.email], ['Téléphone', u.telephone], ['Intégration', integ]].filter(function (c) { return c && (c[1] || c[1] === null); });
    var fiche = $('fiche'); fiche.textContent = '';
    champs.forEach(function (c) {
      var d = el('div'); d.appendChild(el('span', null, c[0]));
      if (c[1] === null) { var b = el('button', 'a-completer', 'à compléter'); b.type = 'button'; b.addEventListener('click', function () { ouvrirProfil(u, manque); }); d.appendChild(b); }
      else { var v = el('b', null, c[1]); v.title = c[1]; d.appendChild(v); }
      fiche.appendChild(d);
    });
    var mail = window.SECRETARIAT_EMAIL, oubli = $('b-oubli');
    if (mail) { oubli.hidden = false; oubli.href = 'mailto:' + mail + '?subject=' + encodeURIComponent('Réinitialisation de mon mot de passe') + '&body=' + encodeURIComponent('Bonjour,\n\nJ\'ai oublié mon mot de passe du portail de la division Infrastructure.\nMerci de m\'envoyer un code de réinitialisation.\n\nNom : ' + u.nom + (u.matricule ? '\nMatricule : ' + u.matricule : '') + '\n\nCordialement.'); }
    if (st) $('accueil').style.setProperty('--agent-bord', st.texte);
  }

  function dessiner(r) {
    dessinerFiche(r.user);
    $('alerte-mdp').hidden = !r.mdp_par_defaut;
    var zone = $('modules'); zone.textContent = '';
    if (!r.menu.length) { zone.appendChild(el('p', 'vide', 'Aucun module n\'est encore activé pour votre compte. Contactez le secrétariat.')); return; }
    r.menu.forEach(function (m) {
      var sec = el('section', 'module');
      var h = el('h3', null, (m.icone || '') + ' ' + m.titre); h.appendChild(el('span', 'niveau', NIVEAUX[m.niveau] || '')); sec.appendChild(h);
      var g = el('div', 'grille');
      if (!m.apps.length) g.appendChild(el('p', 'vide', 'Bientôt disponible.'));
      m.apps.forEach(function (a) {
        var c = el('a', 'app'); c.href = lienSur(a.url);
        // Pages du site : même onglet (la session est propre à l'onglet) ; sites externes : nouvel onglet.
        if (/^https?:\/\//i.test(c.href) && c.origin !== location.origin) { c.target = '_blank'; c.rel = 'noopener'; }
        c.appendChild(el('div', 'em', a.emoji || '📄')); c.appendChild(el('h4', null, a.titre));
        c.appendChild(el('p', null, a.description || '')); c.appendChild(el('div', 'ouvrir', 'Ouvrir →'));
        g.appendChild(c);
      });
      sec.appendChild(g); zone.appendChild(sec);
    });
  }

  // L'agent complète lui-même les champs vides de sa fiche ; une valeur déjà enregistrée ne se modifie plus (secrétariat).
  function ouvrirProfil(u, manque) {
    var dlg = el('dialog', 'dlg'), f = el('form'); f.method = 'dialog';
    f.appendChild(el('h2', null, 'Compléter ma fiche'));
    f.appendChild(el('p', 'aide', 'Ces informations ne sont visibles que par vous et le secrétariat. Une fois enregistrées, elles ne se modifient plus ici : en cas d\'erreur, contactez le secrétariat.'));
    var defs = { matricule: ['Matricule', 'ex. 90514B', 15], sap: ['Matricule SAP', 'ex. 00123456', 15], nin: ['NIN (numéro d\'identification nationale, 18 chiffres)', '18 chiffres', 18] }, champs = {};
    manque.forEach(function (k) {
      var w = el('div', 'champ'), l = el('label', null, defs[k][0]), i = el('input'); i.type = 'text'; i.placeholder = defs[k][1]; i.maxLength = defs[k][2]; i.autocomplete = 'off';
      if (k === 'nin') i.inputMode = 'numeric';
      i.style.cssText = 'width:100%;padding:10px 12px;border:1.5px solid #E5E7EB;border-radius:10px;font:inherit;font-size:15px'; champs[k] = i; w.appendChild(l); w.appendChild(i); f.appendChild(w);
    });
    var msg = el('div', 'msg'); f.appendChild(msg);
    var bt = el('div', 'boutons'), ann = el('button', 'btn-s', 'Annuler'); ann.type = 'button'; ann.addEventListener('click', function () { dlg.close(); });
    var ok = el('button', 'btn', 'Enregistrer'); ok.type = 'submit'; bt.appendChild(ann); bt.appendChild(ok); f.appendChild(bt);
    f.addEventListener('submit', function (e) {
      e.preventDefault(); msg.className = 'msg'; var p = {}; Object.keys(champs).forEach(function (k) { p[k] = champs[k].value.trim(); });
      if (!Object.keys(p).some(function (k) { return p[k]; })) { msg.textContent = 'Renseignez au moins un champ.'; msg.className = 'msg err'; return; }
      ok.disabled = true;
      Api.call('profil_enregistrer', p).then(function (r) { dlg.close(); dessinerFiche(r.user); dessinerStatut(); })
        .catch(function (err) { msg.textContent = err.message; msg.className = 'msg err'; ok.disabled = false; });
    });
    dlg.addEventListener('close', function () { dlg.remove(); }); dlg.appendChild(f); document.body.appendChild(dlg); dlg.showModal ? dlg.showModal() : dlg.setAttribute('open', '');
  }

  function ouvrirMdp() {
    var dlg = document.createElement('dialog'); dlg.className = 'dlg';
    var f = document.createElement('form'); f.method = 'dialog';
    var h = document.createElement('h2'); h.textContent = 'Changer mon mot de passe'; f.appendChild(h);
    var champs = {}; [['ancien', 'Mot de passe actuel', 'current-password'], ['nouveau', 'Nouveau mot de passe (4 caractères minimum)', 'new-password'], ['confirmer', 'Confirmer le nouveau', 'new-password']].forEach(function (c) {
      var w = document.createElement('div'); w.className = 'champ'; var l = document.createElement('label'); l.textContent = c[1];
      var i = document.createElement('input'); i.type = 'password'; i.autocomplete = c[2]; i.style.cssText = 'width:100%;padding:12px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font:inherit;font-size:15px';
      champs[c[0]] = i; w.appendChild(l); w.appendChild(i); f.appendChild(w);
    });
    var msg = document.createElement('div'); msg.className = 'msg'; f.appendChild(msg);
    var bt = document.createElement('div'); bt.className = 'boutons';
    var ann = document.createElement('button'); ann.type = 'button'; ann.className = 'btn-s'; ann.textContent = 'Annuler'; ann.addEventListener('click', function () { dlg.close(); });
    var ok = document.createElement('button'); ok.type = 'submit'; ok.className = 'btn'; ok.textContent = 'Enregistrer'; bt.appendChild(ann); bt.appendChild(ok); f.appendChild(bt);
    f.addEventListener('submit', function (e) {
      e.preventDefault(); msg.className = 'msg';
      if (champs.nouveau.value !== champs.confirmer.value) { msg.textContent = 'Les deux nouveaux mots de passe sont différents.'; msg.className = 'msg err'; return; }
      ok.disabled = true;
      Api.call('changer_mdp', { ancien: champs.ancien.value, nouveau: champs.nouveau.value }).then(function () { dlg.close(); $('alerte-mdp').hidden = true; })
        .catch(function (err) { msg.textContent = err.message; msg.className = 'msg err'; ok.disabled = false; });
    });
    dlg.addEventListener('close', function () { dlg.remove(); }); dlg.appendChild(f); document.body.appendChild(dlg); dlg.showModal ? dlg.showModal() : dlg.setAttribute('open', '');
  }
  $('b-mdp-alerte').addEventListener('click', ouvrirMdp);
  $('b-mdp').addEventListener('click', ouvrirMdp);

  var COUL = { T: '#4EA72E', R: '#E97132' };
  function dessinerStatut(nomAffiche) {
    return Api.call('situation').then(function (r) {
      var box = $('statut'); if (!r.acces) { box.hidden = true; return; }
      box.hidden = false;
      var j = $('jauge'), s = r.configuree ? r.situation : null;
      var pill = $('j-etat'), dates = $('j-dates'), barre = $('j-barre'), bi = $('j-barre-i');
      barre.hidden = true; dates.textContent = '';
      if (!r.configuree) {
        j.className = 'jauge vide'; j.style.setProperty('--p', 0); $('j-reste').textContent = '?'; $('j-lib').textContent = '';
        pill.className = 'etat-pill neutre'; pill.textContent = 'Rotation non renseignée';
        $('phrase').textContent = 'Indiquez où vous en êtes dans votre rotation pour afficher votre planning, vos jours restants et votre prochain changement.';
        $('b-rot').textContent = 'Configurer ma rotation';
      } else if (!s) {
        j.className = 'jauge vide'; j.style.setProperty('--p', 0); $('j-reste').textContent = '–'; $('j-lib').textContent = '';
        pill.className = 'etat-pill neutre'; pill.textContent = 'Rotation à vérifier'; $('phrase').textContent = 'Votre rotation est enregistrée mais ne peut pas être calculée : vérifiez-la.'; $('b-rot').textContent = 'Modifier';
      } else if (s.avant) {
        j.className = 'jauge vide'; j.style.setProperty('--p', 0); $('j-reste').textContent = '…'; $('j-lib').textContent = 'à venir';
        pill.className = 'etat-pill neutre'; pill.textContent = 'Pas encore commencée'; $('phrase').textContent = Rotation.phrase(s); $('b-rot').textContent = 'Modifier';
      } else {
        var pct = Math.max(2, Math.min(100, Math.round(s.jour / s.total * 100)));
        j.className = 'jauge'; j.style.setProperty('--c', COUL[s.statut]); j.style.setProperty('--p', pct);
        $('j-reste').textContent = s.restants; $('j-lib').textContent = s.restants > 1 ? 'jours restants' : 'jour restant';
        pill.className = 'etat-pill ' + s.statut; pill.textContent = (s.statut === 'T' ? 'Au travail' : 'En repos') + ' · jour ' + s.jour + '/' + s.total;
        $('phrase').textContent = Rotation.phrase(s);
        bi.style.width = pct + '%'; bi.style.background = COUL[s.statut]; barre.hidden = false;
        dates.textContent = 'Du ' + Rotation.frDate(s.depuis) + (s.prochain ? ' → prochain changement le ' + Rotation.frDate(s.prochain.date) : '');
        j.setAttribute('aria-label', 'Rotation : jour ' + s.jour + ' sur ' + s.total + ', ' + s.restants + ' jours restants');
        $('b-rot').textContent = 'Modifier ma rotation';
      }
      $('b-rot').onclick = function () { Rotation.ouvrir({ valeurs: r.rotation, onOk: function () { dessinerStatut(nomAffiche); } }); };
    }).catch(function () { $('statut').hidden = true; });
  }

  Api.call('menu').then(function (r) { dessiner(r); return dessinerStatut(r.user.nom); }).catch(function (e) {
    if (e.code === 'SESSION' || !Api.token() && !Api.demo) { Api.setToken(''); location.replace('connexion.html'); return; }
    $('nom-agent').textContent = 'Erreur : ' + e.message;
  });

  $('quitter').addEventListener('click', function () {
    Api.call('logout', { rt: Api.remember() }).catch(function () {}).then(function () { Api.setToken(''); Api.setRemember(''); location.replace('connexion.html'); });
  });
})();
</script>
</body>
</html>
