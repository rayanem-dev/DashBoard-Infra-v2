<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Documents administratifs – Division Infrastructure RNS</title>
<meta name="theme-color" content="#E85D04">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/charte.css">
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/garde.js"></script>
<style>
  .doc-page { max-width: 1400px; margin: 0 auto; padding: 18px 16px 40px; display: grid; grid-template-columns: 270px minmax(300px, 380px) 1fr; gap: 16px; align-items: start; }
  .dp-bloc { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-card); padding: 14px; }
  .dp-liste { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; }
  .dp-liste input[type=search] { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 10px; font: inherit; font-size: 14px; margin-bottom: 8px; background: var(--surface); color: var(--text-dark); }
  .dp-cat { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin: 12px 4px 4px; }
  .dp-m { display: block; width: 100%; text-align: left; border: 1.5px solid transparent; background: none; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-dark); padding: 7px 10px; border-radius: 9px; cursor: pointer; }
  .dp-m:hover { background: var(--surface-2); } .dp-m.on { border-color: var(--orange-main); background: var(--orange-pale); color: var(--orange-dark); }
  .dp-form h2 { font-size: 17px; margin-bottom: 2px; } .dp-form .desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; }
  .dp-form label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-muted); margin: 10px 0 3px; text-transform: none; letter-spacing: 0; }
  .dp-form input, .dp-form select, .dp-form textarea { width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 9px; font: inherit; font-size: 14px; background: var(--surface); color: var(--text-dark); }
  .dp-form textarea { min-height: 70px; resize: vertical; }
  .dp-rep { border: 1.5px dashed var(--border); border-radius: 10px; padding: 8px; margin-top: 4px; }
  .dp-rep .lg { display: grid; gap: 4px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .dp-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .dp-actions .btn-s { padding: 9px 14px; font-size: 13px; }
  .dp-actions .principal { background: var(--orange-main); border-color: var(--orange-main); color: #fff; }
  .dp-apercu { overflow: auto; background: #E5E7EB; padding: 14px; border-radius: 16px; }
  #apercu { background: #fff; color: #000; width: 210mm; max-width: 100%; min-height: 297mm; margin: 0 auto; padding: 16mm 16mm 14mm; box-shadow: 0 2px 14px rgba(0,0,0,.2); }
  .dp-vide { color: var(--text-muted); text-align: center; padding: 50px 10px; font-size: 14px; }
  @media (max-width: 1100px) { .doc-page { grid-template-columns: 240px 1fr; } .dp-apercu { grid-column: 1 / -1; } }
  @media (max-width: 700px) { .doc-page { grid-template-columns: 1fr; } .dp-liste { position: static; max-height: 260px; } #apercu { padding: 10mm 8mm; } }
  @media print {
    /* A4 portrait imposé ; marge de page à 0 (cela supprime aussi l'en-tête / pied du navigateur : date, titre, adresse) et marges internes dans la feuille */
    @page { size: A4 portrait; margin: 0; }
    html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; filter: none !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body > *:not(main), .doc-page > *:not(.dp-apercu) { display: none !important; }
    .doc-page { display: block !important; padding: 0 !important; margin: 0 !important; max-width: none !important; width: auto !important; }
    .dp-apercu { background: none !important; padding: 0 !important; overflow: visible !important; border-radius: 0 !important; }
    #apercu { box-shadow: none !important; width: 210mm !important; max-width: none !important; min-height: 0 !important; margin: 0 !important; padding: 14mm 15mm !important; box-sizing: border-box; overflow: visible !important; }
    #apercu .doc table { width: 100% !important; }
  }
</style>
<style id="css-doc"></style>
</head>
<body>
<header class="bandeau"><div class="bandeau-inner">
  <div class="logo-area"><div class="logo-circle">SH</div>
    <div class="logo-text"><h1>Documents administratifs</h1><p>Sonatrach · Direction Régionale Rhourde Nouss</p></div></div>
  <div class="bandeau-droite"><a class="btn-ghost" href="portail.html" style="text-decoration:none">← Retour au portail</a></div>
</div></header>
<div id="demo" class="demo-banner" hidden>MODE DÉMO — données fictives</div>
<main class="doc-page">
  <aside class="dp-bloc dp-liste"><input type="search" id="q" placeholder="Rechercher un document…" aria-label="Rechercher un document"><div id="liste"></div></aside>
  <section class="dp-bloc dp-form" id="form"><div class="dp-vide">Choisissez un document dans la liste : le formulaire se remplit avec vos informations et l'aperçu se met à jour à chaque frappe.</div></section>
  <datalist id="dl-personnes"></datalist>
  <section class="dp-apercu dp-impr"><div id="apercu" data-i18n-non></div></section>
</main>
<script src="js/documents-modeles.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (window.Api && Api.demo) $('demo').hidden = false;
  document.getElementById('css-doc').textContent = Documents.css;
  var user = {}, courant = null, valeurs = {}, brouillons = {}, personnes = [];
  // Personnes de BDDORGA (annuaire du portail) : proposées dans les champs « nom », elles remplissent aussi matricule, fonction, service…
  function chargerPersonnes() {
    if (!window.Api) return;
    Api.call('annuaire_personnes').then(function (r) {
      personnes = (r.personnes || []).filter(function (p) { return p.nom; });
      var dl = $('dl-personnes'); dl.textContent = '';
      personnes.forEach(function (p) { var o = el('option'); o.value = p.nom; o.label = [p.matricule, p.fonction].filter(Boolean).join(' · '); dl.appendChild(o); });
    }).catch(function () { /* sans annuaire, la saisie libre reste possible */ });
  }
  function trouverPersonne(txt) {
    var q = norm(txt); if (!q) return null;
    var exact = personnes.filter(function (p) { return norm(p.nom) === q; }); if (exact.length) return exact[0];
    var mots = q.split(' ').filter(Boolean), c = personnes.filter(function (p) { var n = norm(p.nom); return mots.every(function (m) { return n.indexOf(m) !== -1; }); });
    return c.length === 1 ? c[0] : null;
  }
  /** Reporte la personne choisie dans les champs liés (c.pers : propriété de la personne → clé(s) du champ du document). */
  function appliquerPersonne(pers, cible, p) {
    Object.keys(pers).forEach(function (prop) { [].concat(pers[prop]).forEach(function (k) { cible[k] = p[prop] || ''; }); });
  }
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  function dessinerListe() {
    var q = norm($('q').value), z = $('liste'); z.textContent = '';
    Documents.categories.forEach(function (c) {
      var ms = Documents.modeles.filter(function (m) { return m.categorie === c.id && (!q || norm(m.titre + ' ' + m.description).indexOf(q) !== -1); });
      if (!ms.length) return;
      z.appendChild(el('div', 'dp-cat', c.emoji + ' ' + c.titre));
      ms.forEach(function (m) { var b = el('button', 'dp-m' + (courant && courant.id === m.id ? ' on' : ''), m.titre); b.type = 'button'; b.onclick = function () { ouvrir(m.id); }; z.appendChild(b); });
    });
    if (!z.firstChild) z.appendChild(el('div', 'dp-vide', 'Aucun document ne correspond.'));
  }

  function apercu() { $('apercu').innerHTML = Documents.rendre(courant, valeurs); brouillons[courant.id] = valeurs; }

  function saisie(c) {
    var i;
    if (c.t === 'textarea') { i = el('textarea'); }
    else if (c.t === 'select') { i = el('select'); (c.opts || []).forEach(function (o) { var op = el('option', null, o || '—'); op.value = o; i.appendChild(op); }); }
    else if (c.t === 'repeat') return repeat(c);
    else { i = el('input'); i.type = c.t === 'date' ? 'date' : c.t === 'number' ? 'number' : 'text'; if (c.max) i.max = c.max; if (c.t === 'number') i.min = 0; if (c.pers) { i.setAttribute('list', 'dl-personnes'); i.placeholder = 'Tapez pour chercher dans BDDORGA'; i.autocomplete = 'off'; } }
    i.value = valeurs[c.k] == null ? '' : valeurs[c.k];
    i.oninput = i.onchange = function () { valeurs[c.k] = i.value; apercu(); };
    if (c.pers) i.addEventListener('change', function () {
      var p = trouverPersonne(i.value); if (!p) return;
      i.value = p.nom; valeurs[c.k] = p.nom; appliquerPersonne(c.pers, valeurs, p);
      Object.keys(c.pers).forEach(function (prop) { [].concat(c.pers[prop]).forEach(function (k) { var f = $('f-' + k); if (f) f.value = valeurs[k]; }); });
      apercu();
    });
    return i;
  }

  function repeat(c) {
    var w = el('div', 'dp-rep'), corps = el('div');
    function dessiner() {
      corps.textContent = '';
      (valeurs[c.k] || []).forEach(function (ligne, n) {
        var g = el('div', 'lg');
        c.colonnes.forEach(function (col) {
          var i;
          if (col.t === 'select') { i = el('select'); col.opts.forEach(function (o) { var op = el('option', null, o || col.l + ' : —'); op.value = o; i.appendChild(op); }); }
          else { i = el('input'); i.type = col.t === 'date' ? 'date' : col.t === 'number' ? 'number' : 'text'; i.placeholder = col.pers ? col.l + ' (BDDORGA)' : col.l; if (col.pers) { i.setAttribute('list', 'dl-personnes'); i.autocomplete = 'off'; } }
          i.value = ligne[col.k] || ''; i.setAttribute('aria-label', col.l); i.oninput = i.onchange = function () { ligne[col.k] = i.value; apercu(); };
          if (col.pers) i.addEventListener('change', function () { var p = trouverPersonne(i.value); if (!p) return; ligne[col.k] = p.nom; appliquerPersonne(col.pers, ligne, p); dessiner(); apercu(); });
          g.appendChild(i);
        });
        var r = el('button', 'btn-s', '✕ Retirer'); r.type = 'button'; r.onclick = function () { valeurs[c.k].splice(n, 1); dessiner(); apercu(); }; g.appendChild(r);
        corps.appendChild(g);
      });
    }
    var a = el('button', 'btn-s', '+ Ajouter une ligne'); a.type = 'button'; a.onclick = function () { valeurs[c.k] = valeurs[c.k] || []; valeurs[c.k].push({}); dessiner(); apercu(); };
    w.appendChild(corps); w.appendChild(a);
    if (c.generer) { var g = el('button', 'btn-s', '⚡ Remplir automatiquement (jour par jour)'); g.type = 'button'; g.style.marginLeft = '6px'; g.onclick = function () { var r = c.generer(valeurs); if (!r.length) { alert('Renseignez d\'abord la date de départ et la date d\'arrivée finale.'); return; } valeurs[c.k] = r; dessiner(); apercu(); }; w.appendChild(g); }
    dessiner(); return w;
  }

  function ouvrir(id) {
    courant = Documents.trouver(id); if (!courant) return;
    valeurs = brouillons[id] || Documents.valeursInitiales(courant, user);
    var f = $('form'); f.textContent = '';
    f.appendChild(el('h2', null, courant.titre)); f.appendChild(el('p', 'desc', courant.description));
    courant.champs.forEach(function (c) { var l = el('label', null, c.l); l.htmlFor = 'f-' + c.k; f.appendChild(l); var i = saisie(c); i.id = 'f-' + c.k; f.appendChild(i); });
    var a = el('div', 'dp-actions');
    var p = el('button', 'btn-s principal', '🖨 Imprimer'); p.type = 'button'; p.onclick = function () { window.print(); };
    var r = el('button', 'btn-s', '↺ Réinitialiser'); r.type = 'button'; r.onclick = function () { delete brouillons[id]; ouvrir(id); };
    a.appendChild(p); a.appendChild(r); f.appendChild(a);
    f.appendChild(el('p', 'desc', 'Les cases laissées vides s\'impriment en pointillés pour être complétées à la main. Dans la fenêtre d\'impression, choisissez « Enregistrer au format PDF » pour obtenir un fichier.'));
    dessinerListe(); apercu();
    if (window.innerWidth < 1100) $('apercu').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  $('q').oninput = dessinerListe; dessinerListe();
  var voulu = (location.hash || '').slice(1);
  window.addEventListener('hashchange', function () { voulu = (location.hash || '').slice(1); ouvrirVoulu(); });
  function ouvrirVoulu() { if (voulu && Documents.trouver(voulu)) ouvrir(voulu); }
  chargerPersonnes();
  if (window.Api) Api.call('menu').then(function (r) { user = r.user || {}; }).catch(function () { /* garde.js gère la session */ }).then(ouvrirVoulu); else ouvrirVoulu();
})();
</script>
<script src="js/pied.js"></script>
</body>
</html>
