<style>
  .st { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; }
  .bloc { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-card); padding: 14px 16px; margin-bottom: 14px; }
  .bloc h2 { font-size: 14px; margin: 0 0 8px; }
  .barre { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .st input, .st select { padding: 7px 9px; border: 1.5px solid var(--border); border-radius: 9px; font: inherit; font-size: 13.5px; background: var(--surface); color: var(--text-dark); }
  .btn-p { padding: 9px 15px; border: 0; border-radius: 10px; background: linear-gradient(135deg, var(--orange-main), var(--orange-light)); color: #fff; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  table.edit { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.edit th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); padding: 6px 6px; border-bottom: 2px solid var(--border); }
  table.edit td { padding: 4px 4px; border-bottom: 1px solid var(--border); }
  table.edit td input { width: 100%; box-sizing: border-box; }
  table.edit td.n input { text-align: right; }
  table.edit tr.mod td:first-child { box-shadow: inset 3px 0 0 var(--orange-main); }
  .total td { font-weight: 800; border-top: 2px solid var(--text-dark); padding: 8px 6px; }
  .note { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .onglets { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .onglets button { padding: 8px 16px; border: 1.5px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text-dark); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .onglets button.actif { background: linear-gradient(135deg, var(--orange-main), var(--orange-light)); color: #fff; border-color: transparent; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-card); padding: 12px 14px; }
  .kpi b { display: block; font-size: 24px; line-height: 1.15; color: var(--text-dark); font-variant-numeric: tabular-nums; } .kpi span { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
  .kpi small { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .barre-taux { display: inline-block; vertical-align: middle; width: 70px; height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-inline-end: 6px; } .barre-taux i { display: block; height: 100%; background: var(--orange-main); }
  table.res { width: 100%; border-collapse: collapse; font-size: 13px; } table.res th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); padding: 6px; border-bottom: 2px solid var(--border); } table.res td { padding: 6px; border-bottom: 1px solid var(--border); vertical-align: top; } table.res td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .alerte-st { color: #8a1c1c; font-size: 13px; margin: 4px 0; } .vert { color: #1b7a3a; } .rouge { color: #8a1c1c; }
  #graphe svg { width: 100%; height: auto; display: block; } #graphe text { fill: var(--text-muted); font-size: 10px; }
  .apercu { overflow: auto; background: #E5E7EB; padding: 14px; border-radius: 14px; }
  #feuille { background: #fff; color: #111; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 14mm 15mm 12mm; box-shadow: 0 2px 14px rgba(0,0,0,.2); font-family: Arial, Helvetica, sans-serif; position: relative; box-sizing: border-box; transform-origin: top left; }
  #feuille .tete { display: flex; justify-content: space-between; align-items: flex-start; gap: 8mm; }
  #feuille .tete img { width: 20mm; height: auto; display: block; }
  #feuille .org { font-size: 9pt; line-height: 1.45; margin-top: 1mm; }
  #feuille .tit { text-align: right; } #feuille .tit h1 { font-size: 15pt; margin: 4mm 0 2mm; letter-spacing: .3px; } #feuille .tit .mois { font-size: 12pt; font-weight: 700; color: #B94E00; text-transform: capitalize; }
  #feuille .trait { height: 2.2mm; background: #F0A030; margin: 5mm -15mm 6mm 38mm; }
  #feuille .div { font-size: 10pt; margin-bottom: 4mm; }
  #feuille table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
  #feuille th { background: #E85D04; color: #fff; border: 1px solid #B94E00; padding: 2.4mm 2mm; text-align: center; font-size: 9pt; }
  #feuille td { border: 1px solid #999; padding: 2.2mm 2.4mm; vertical-align: middle; }
  #feuille tbody tr:nth-child(even) td { background: #FFF4EA; }
  #feuille td.c { text-align: center; } #feuille td.r { text-align: right; font-variant-numeric: tabular-nums; }
  #feuille tfoot td { font-weight: 800; background: #FDE3C8 !important; border-top: 2px solid #111; }
  #feuille .pied { margin-top: 8mm; font-size: 8pt; color: #555; }
  #feuille .sig { display: flex; justify-content: space-between; margin-top: 12mm; font-size: 9.5pt; font-weight: 700; }
  @media (max-width: 800px) { table.edit { font-size: 12.5px; } }
  @media print {
    @page { size: A4 portrait; margin: 0; }
    html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; height: auto !important; min-height: 0 !important; filter: none !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body > *:not(main) { display: none !important; } .st > *:not(.apercu) { display: none !important; }
    .st { padding: 0 !important; max-width: none !important; } .apercu { background: none !important; padding: 0 !important; overflow: visible !important; height: auto !important; }
    #feuille { box-shadow: none !important; transform: none !important; margin: 0 !important; min-height: 0 !important; width: 210mm !important; }
  }
</style>
<style>
  .stats-un .tb { margin: 0 0 14px; } .stats-un .tb-grille { grid-template-columns: 1fr; } .stats-un .tb-carte { cursor: default; }
  #v-bloc table.res td, #v-bloc table.res th { padding: 6px 8px; } #v-bloc table.res tr:nth-child(even) td { background: rgba(0,0,0,.025); }

  .ruban-pl { display: inline-flex; gap: 1px; vertical-align: middle; } .ruban-pl i { width: 6px; height: 12px; display: inline-block; } .ruban-pl i.T { background: #F0A030; } .ruban-pl i.R { background: #2E9E5B; } .ruban-pl i.A { background: #9CA3AF; } .ruban-pl i.p { background: #E5E7EB; }

<body>
<header class="bandeau"><div class="bandeau-inner">
  <div class="logo-area"><div class="logo-circle">📊</div>
    <div class="logo-text"><h1>Statistiques</h1><p>Tous les carrés du tableau de bord, en détail · Rapport</p></div></div>

<script>
// ----- Statistiques : un onglet par carré du tableau de bord de l'accueil (le clic sur un carré ouvre son onglet, avec le détail complet)
(function () {
  var $ = function (id) { return document.getElementById(id); }, DB = null, courant = '';
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function frj(d) { return String(d || '').split('-').reverse().join('/'); }
  var ONGLETS = [['presence', '🏕 Présence sur site', 'presents'], ['jour', '📝 Rapports du jour', 'rapports_jour'], ['effectif', '👷 Effectif des chantiers', 'effectif'], ['semaines', '🗓 Rapports par semaine', 'rapports_semaines'], ['ouvriers', '👷 Ouvriers par chantier', 'effectif_chantiers'],
    ['classement', '🏆 Classement des rapporteurs', 'classement'], ['saisie', '🔔 Suivi de la saisie', 'suivi_saisie'], ['avancement', '📈 Avancement / délai', 'avancement'], ['contrats', '📑 Contrats', 'contrats'], ['planning', '🗓 Planning de la division', 'planning'], ['inventaire', '📦 Inventaire', 'inventaire'], ['documents', '🗂️ Documents établis', 'documents']];
  function table(entetes, lignes, opts) {
    var t = el('table', 'res'), th = el('tr'); entetes.forEach(function (x) { th.appendChild(el('th', null, x)); }); t.appendChild(th);
    (lignes || []).forEach(function (l) { var tr = el('tr'); l.forEach(function (c) { var td = el('td'); if (c instanceof Node) td.appendChild(c); else td.textContent = c == null ? '' : String(c); tr.appendChild(td); }); t.appendChild(tr); });
    if (!lignes || !lignes.length) { var tr = el('tr'), td = el('td', null, 'Rien à afficher.'); td.colSpan = entetes.length; td.style.color = 'var(--text-muted)'; tr.appendChild(td); t.appendChild(tr); }
    var w = el('div', 'bloc'); if (opts && opts.titre) w.appendChild(el('h2', null, opts.titre)); w.style.overflowX = 'auto'; w.appendChild(t); return w;
  }
  function ruban(s) { var w = el('span', 'ruban-pl'); String(s || '').split('').forEach(function (c) { w.appendChild(el('i', c === 'T' ? 'T' : c === 'R' ? 'R' : c === 'A' ? 'A' : 'p')); }); return w; }
  /** Détail complet (listes entières, périodes longues) d'un carré. */
  function detail(id, d) {
    var b = d.blocs || {}, z = $('v-bloc-detail'); z.textContent = '';
    function ajout(x) { z.appendChild(x); }
    if (id === 'presence') ajout(table(['Entreprise', 'Prestataires hébergés aujourd\'hui'], (b.presents.entreprises || []).map(function (x) { return [x.nom, x.n]; }), { titre: 'Par entreprise' })), ajout(table(['Jour', 'Présents'], (b.presents.serie || []).slice().reverse().map(function (x) { return [frj(x.date), x.total]; }), { titre: '30 derniers jours' }));
    if (id === 'jour') ajout(table(['Chantier sans rapport aujourd\'hui', 'Service'], (b.rapports_jour.manquants || []).map(function (x) { return [x.nom, x.service || '']; }), { titre: b.rapports_jour.recus + ' rapport(s) reçu(s) sur ' + b.rapports_jour.total + ' chantier(s)' }));
    if (id === 'effectif') ajout(table(['Jour', 'Total'].concat(b.effectif.services.map(function (s) { return s.nom; })), b.effectif.jours.slice().reverse().map(function (j) { return [frj(j.date), j.total].concat(b.effectif.services.map(function (s) { return j.par[s.id] || 0; })); }), { titre: 'Effectif déclaré par jour et par service' }));
    if (id === 'semaines') ajout(table(['Semaine du', 'Rapports', 'Jours avec rapport', 'Rapports par jour d\'activité'], b.rapports_semaines.semaines.slice().reverse().map(function (w) { return [frj(w.debut) + (w.enCours ? ' (en cours)' : ''), w.rapports, w.joursActifs, w.parJourActif == null ? '' : String(Math.round(w.parJourActif * 10) / 10).replace('.', ',')]; }), { titre: 'Semaine = samedi → vendredi' }));
    if (id === 'ouvriers') ajout(table(['Chantier', 'Service'].concat(b.effectif_chantiers.semaines.map(function (w) { return frj(w.debut); })).concat(['Moyenne']), b.effectif_chantiers.chantiers.map(function (c) { return [c.nom, c.service].concat(c.valeurs.map(function (v) { return String(Math.round(v * 10) / 10).replace('.', ','); })).concat([String(c.moyenne).replace('.', ',')]); }), { titre: 'Effectif moyen par semaine' }));
    if (id === 'classement') ajout(table(['#', 'Rapporteur', 'Rapports', 'Jours', 'Chantiers', 'Dernier'], b.classement.rapporteurs.map(function (r, i) { return [i + 1, r.nom, r.rapports, r.jours, r.chantiers, frj(r.dernier)]; }), { titre: b.classement.total + ' rapporteur(s) sur 60 jours' }));
    if (id === 'saisie') { ajout(table(['Chantier', 'Service', 'Dernier rapport', 'Jours sans rapport'], b.suivi_saisie.silencieux.map(function (c) { return [c.nom, c.service, c.dernier ? frj(c.dernier) : 'aucun récent', c.jours == null ? '—' : c.jours]; }), { titre: 'Chantiers sans rapport depuis 3 jours ou plus' })); ajout(table(['Chantier', 'Signalements', 'Dernier', 'Dernière difficulté'], b.suivi_saisie.difficultes.map(function (x) { return [x.nom, x.n, frj(x.date), x.texte]; }), { titre: 'Difficultés signalées (30 jours)' })); }
    if (id === 'avancement') { ajout(table(['Chantier', 'Service', 'Avancement', 'Délai écoulé', 'Retard (points)'], b.avancement.chantiers.map(function (c) { return [c.nom, c.service, c.avancement + ' %', c.delai + ' %', c.retard]; }), { titre: b.avancement.en_retard + ' chantier(s) en retard sur ' + b.avancement.suivis + ' suivis' })); ajout(table(['Contrat', 'Entreprise', 'Échéance', 'Jours restants'], (b.echeances || []).map(function (e) { return [e.nom, e.entreprise, e.echeance, e.jours]; }), { titre: 'Échéances à moins de 180 jours' })); }
    if (id === 'contrats') { ajout(table(['Statut', 'Dossiers'], b.contrats.map(function (c) { return [c.nom, c.n]; }), { titre: 'Par statut' })); ajout(table(['Statut', 'Dossier', 'Attribué à', 'Avancement', 'Échéance'], (d.contrats_liste || []).map(function (x) { return [x.statut, x.intitule, x.attribue_a, x.pourcent, x.echeance]; }), { titre: 'Tous les dossiers du Suivi CPM' })); }
    if (id === 'planning') ajout(table(['Nom', 'Service', 'Situation', 'Jour', 'Prochain changement', '28 jours'], (b.planning.personnes || []).map(function (x) { return [x.nom, x.service, x.statut === 'T' ? 'En poste' : x.statut === 'R' ? 'À la maison' : 'En congé', x.jour + ' / ' + x.total, x.prochain ? frj(x.prochain) : '', ruban(x.ruban)]; }), { titre: b.planning.travail + ' en poste · ' + b.planning.repos + ' à la maison' + (b.planning.conge ? ' · ' + b.planning.conge + ' en congé' : '') + ' — ' + b.planning.portee }));
    if (id === 'inventaire') { var iv = b.inventaire, st = iv.stats || {}; ajout(table(['Indicateur', 'Valeur'], [['Exercice', iv.annee], ['Articles à retrouver', iv.total], ['Retrouvés', iv.trouves + ' (' + String(iv.pct).replace('.', ',') + ' %)'], ['Restants', iv.restants], ['Retrouvés aujourd\'hui', iv.ce_jour], ['Rythme (7 derniers jours)', st.rythme != null ? String(st.rythme).replace('.', ',') + ' / jour' : ''], ['Fin estimée à ce rythme', st.fin ? frj(st.fin) : ''], ['Meilleur jour', st.meilleur ? st.meilleur.n + ' le ' + frj(st.meilleur.date) : '']], { titre: 'Point de situation' })); ajout(table(['#', 'Personne', 'Articles retrouvés'], (st.podium || []).map(function (p, i) { return [i + 1, p.nom, p.n]; }), { titre: 'Classement des personnes' })); }
    if (id === 'documents') documentsPeriode();
  }
  /** Documents établis : période au choix, jour par jour et par personne (journal du portail et rapports journaliers). */
  function documentsPeriode() {
    var z = $('v-bloc-detail'), now = new Date(), iso = function (d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
    var w = el('div', 'bloc'), barre = el('div', 'barre'), du = el('input'), au = el('input'), ok = el('button', 'btn-s', '↻ Afficher'), xl = el('button', 'btn-s', '⬇ Excel'); du.type = au.type = 'date'; du.value = iso(new Date(now.getTime() - 6 * 864e5)); au.value = iso(now); ok.type = xl.type = 'button';
    w.appendChild(el('h2', null, 'Par jour et par personne')); barre.appendChild(el('span', 'note', 'Du')); barre.appendChild(du); barre.appendChild(el('span', 'note', 'au')); barre.appendChild(au); barre.appendChild(ok); barre.appendChild(xl); w.appendChild(barre);
    var etat = el('p', 'note', ''), corps = el('div'); w.appendChild(etat); w.appendChild(corps); z.appendChild(w); var dernier = null;
    function charger() {
      etat.textContent = 'Chargement…'; corps.textContent = '';
      Api.call('activite_documents', { du: du.value, au: au.value }).then(function (r) {
        dernier = r; var tot = r.jours.reduce(function (n, j) { return n + j.total; }, 0);
        etat.textContent = tot + ' document(s) du ' + frj(r.du) + ' au ' + frj(r.au) + (r.complet ? '' : ' (les plus anciennes lignes du journal ne sont pas relues)') + '.';
        var tp = Object.keys(r.types).sort(function (a, b) { return r.types[b] - r.types[a]; }); if (tp.length) corps.appendChild(el('p', null, tp.map(function (t) { return t + ' : ' + r.types[t]; }).join('  ·  ')));
        var lignes = []; r.jours.forEach(function (j) { j.personnes.forEach(function (x) { lignes.push([frj(j.date), x.nom, x.total, Object.keys(x.types).map(function (k) { return x.types[k] + ' × ' + k; }).join(', ')]); }); });
        corps.appendChild(table(['Jour', 'Personne', 'Total', 'Détail'], lignes));
      }).catch(function (e) { etat.textContent = e.message; });
    }
    ok.onclick = charger; xl.onclick = function () {
      if (!dernier || !window.ExportExcel) return; var types = Object.keys(dernier.types).sort(), lignes = [];
      dernier.jours.slice().reverse().forEach(function (j) { j.personnes.forEach(function (x) { lignes.push([frj(j.date), x.nom, x.total].concat(types.map(function (t) { return x.types[t] || ''; }))); }); });
      ExportExcel.telecharger({ fichier: 'documents-etablis-' + dernier.du + '_' + dernier.au + '.xlsx', titre: 'Documents établis par jour et par personne', sousTitre: 'Du ' + frj(dernier.du) + ' au ' + frj(dernier.au), feuilles: [{ nom: 'Par personne', colonnes: [{ titre: 'Date' }, { titre: 'Nom' }, { titre: 'Total', nombre: true }].concat(types.map(function (t) { return { titre: t, nombre: true }; })), lignes: lignes }] });
    };
    charger();
  }
  function ouvrir(id) {
    var o = ONGLETS.filter(function (x) { return x[0] === id; })[0]; if (!o || !DB || !DB.blocs[o[2]]) return;
    courant = id; $('v-bloc').hidden = false;
    document.querySelectorAll('.onglets button.bl').forEach(function (b) { b.classList.toggle('actif', b.dataset.id === id); });
    TableauBord.styles(); TableauBord.monter($('v-bloc-carte'), DB, [], { seul: o[2], sansLien: true, detail: true }); detail(id, DB);
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* rien */ }
  }
  if (window.Api) Api.call('tableau_bord', { detail: true }).then(function (d) {
    DB = d; var barre = document.querySelector('.onglets');
    ONGLETS.forEach(function (o) { if (!d.blocs[o[2]]) return; var b = el('button', 'bl', o[1]); b.type = 'button'; b.dataset.id = o[0]; b.setAttribute('role', 'tab'); b.onclick = function () { ouvrir(o[0]); }; barre.appendChild(b); });
    var h = String(location.hash || '').slice(1), premier = ONGLETS.filter(function (o) { return d.blocs[o[2]]; })[0]; if (h) ouvrir(h); else if (premier) ouvrir(premier[0]);
    if (!premier) $('v-bloc-detail').appendChild(el('p', 'note', 'Aucune statistique disponible pour votre compte.'));
    window.addEventListener('hashchange', function () { var k = String(location.hash || '').slice(1); if (k && k !== courant) ouvrir(k); });
  }).catch(function () { /* sans tableau de bord : seuls les deux onglets d'origine */ });
})();
</script>
