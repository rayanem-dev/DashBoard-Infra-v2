<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ordre de travail – Division Infrastructure RNS</title>
<meta name="theme-color" content="#E85D04">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/charte.css">
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/garde.js"></script>
<style>
  .ot { max-width: 1400px; margin: 0 auto; padding: 16px 16px 40px; display: grid; grid-template-columns: 400px 1fr; gap: 16px; align-items: start; }
  .bloc { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-card); padding: 14px 16px; margin-bottom: 14px; }
  .bloc h2 { font-size: 14px; margin: 0 0 8px; }
  .ot label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin: 10px 0 3px; }
  .ot label small { text-transform: none; font-weight: 500; letter-spacing: 0; }
  .ot input, .ot textarea, .ot select { width: 100%; padding: 7px 9px; border: 1.5px solid var(--border); border-radius: 9px; font: inherit; font-size: 13.5px; background: var(--surface); color: var(--text-dark); }
  .ot textarea { resize: vertical; } .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .trois { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .lig { display: grid; gap: 6px; margin-bottom: 5px; } .lig.p { grid-template-columns: 1fr 56px 56px; } .lig.a { grid-template-columns: 1fr 70px; }
  .ot .radios { display: flex; gap: 16px; align-items: center; margin-top: 4px; } .ot .radios label { display: flex; gap: 6px; align-items: center; margin: 0; text-transform: none; font-size: 14px; letter-spacing: 0; color: var(--text-dark); } .ot .radios input { width: auto; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn-p { padding: 10px 16px; border: 0; border-radius: 10px; background: linear-gradient(135deg, var(--orange-main), var(--orange-light)); color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .histo { display: flex; gap: 8px; align-items: center; border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 12.5px; } .histo .i { flex: 1; min-width: 0; } .histo b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .apercu { overflow: auto; background: #E5E7EB; padding: 14px; border-radius: 14px; }
  #feuille { background: #fff; color: #000; width: 297mm; height: 210mm; margin: 0 auto; padding: 8mm 10mm; box-shadow: 0 2px 14px rgba(0,0,0,.2); font-family: Arial, Helvetica, sans-serif; position: relative; transform-origin: top left; box-sizing: border-box; font-size: 8.5pt; }
  #feuille .tete { text-align: center; font: italic bold 12pt 'Times New Roman', serif; margin-bottom: 1mm; }
  #feuille .haut { display: grid; grid-template-columns: 72mm 1fr 92mm; gap: 3mm; align-items: start; }
  #feuille .id { font: italic bold 10pt 'Times New Roman', serif; line-height: 1.4; } #feuille h1 { text-align: center; font-size: 17pt; margin: 6mm 0 0; text-decoration: underline; letter-spacing: .3px; }
  #feuille table { border-collapse: collapse; width: 100%; } #feuille td, #feuille th { border: 1px solid #000; padding: 1mm 1.6mm; vertical-align: middle; font-size: 8pt; }
  #feuille .cadre td:first-child { font: italic 8pt Arial; width: 52%; } #feuille .cadre td { height: 5.3mm; }
  #feuille .mid { display: grid; grid-template-columns: 1fr 92mm; gap: 3mm; margin-top: 3mm; }
  #feuille .desc { border: 1px solid #000; min-height: 40mm; padding: 1.5mm 3mm; } #feuille .desc b { text-decoration: underline; font-size: 8.5pt; } #feuille .desc div { white-space: pre-wrap; margin-top: 1.5mm; font-size: 9pt; }
  #feuille .coche { text-align: center; font-weight: 700; } #feuille .coche.on { background: #ddd; }
  #feuille .princ { margin-top: 3mm; } #feuille .princ th { font-size: 8pt; text-align: left; font-style: italic; } #feuille .princ td { height: 8.2mm; font-size: 8.5pt; }
  #feuille .princ td.r { vertical-align: top; white-space: pre-wrap; } #feuille .bas td { text-align: center; font-size: 8pt; height: 8mm; } #feuille .bas td.le { height: 16mm; text-align: left; vertical-align: top; font-size: 7.5pt; }
  #feuille .pied { position: absolute; left: 10mm; bottom: 4mm; font-size: 6.5pt; color: #555; }
  @media (max-width: 1100px) { .ot { grid-template-columns: 1fr; } }
  @media print { @page { size: A4 landscape; margin: 0; } html, body { background: #fff !important; margin: 0 !important; filter: none !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; } body > *:not(main), .ot > *:not(.apercu) { display: none !important; }
    .ot { display: block !important; padding: 0 !important; max-width: none !important; } .apercu { background: none !important; padding: 0 !important; overflow: visible !important; } #feuille { box-shadow: none !important; margin: 0 !important; transform: none !important; } }
</style>
</head>
<body>
<header class="bandeau"><div class="bandeau-inner">
  <div class="logo-area"><div class="logo-circle">OT</div>
    <div class="logo-text"><h1>Ordre de travail</h1><p>Sonatrach · RNS · Division Infrastructure</p></div></div>
  <div class="bandeau-droite"><a class="btn-ghost" href="portail.html" style="text-decoration:none">← Retour au portail</a></div>
</div></header>
<div id="demo" class="demo-banner" hidden>MODE DÉMO — données fictives</div>
<main class="ot">
  <div>
    <div class="bloc">
      <h2>🛠 Nouvel ordre de travail</h2>
      <div class="trois">
        <div><label for="f-div">Division</label><input type="text" id="f-div"></div>
        <div><label for="f-lieu">Lieu</label><input type="text" id="f-lieu"></div>
        <div><label for="f-imp">Imputation</label><input type="text" id="f-imp" list="dl-imp"></div>
      </div>
      <datalist id="dl-imp"><option value="4300045000">Division</option><option value="4300045100">Électromécanique</option><option value="4300045200">Travaux Entretien</option></datalist>
      <div class="deux"><div><label for="f-num">Ordre de travail N°</label><input type="text" id="f-num"></div><div><label for="f-le">Rhourde Nouss, le</label><input type="date" id="f-le"></div></div>
      <label for="f-equ">Équipement ou installation</label><input type="text" id="f-equ">
      <label for="f-suivi">Suivi par <small>(un nom de l'annuaire peut être choisi)</small></label><input type="text" id="f-suivi" list="dl-pers">
      <datalist id="dl-pers"></datalist>
      <label for="f-desc">Description du travail <small>(une ligne = un tiret)</small></label><textarea id="f-desc" rows="4"></textarea>
      <div class="deux"><div><label>Fourniture de pièces</label><div class="radios"><label><input type="radio" name="f-four" value="AVEC"> AVEC</label><label><input type="radio" name="f-four" value="SANS"> SANS</label></div></div>
        <div><label for="f-h">Nbre d'heures d'intervention</label><input type="text" id="f-h"></div></div>
      <label for="f-rep">Date de réparation</label><input type="date" id="f-rep">
    </div>
    <div class="bloc">
      <h2>Travaux, pièces et agents</h2>
      <label for="f-res">Résumé des travaux</label><textarea id="f-res" rows="4"></textarea>
      <label>Pièces de rechange utilisées <small>(désignation · Q.SH · Q.PR)</small></label><div id="l-pieces"></div>
      <label>Agents intervenants <small>(nom · heure)</small></label><div id="l-agents"></div>
    </div>
    <div class="bloc">
      <h2>Signatures</h2>
      <div class="deux"><div><label for="f-svc">Service émetteur</label><input type="text" id="f-svc"></div><div><label for="f-resp">Responsable exécution</label><input type="text" id="f-resp"></div></div>
      <div class="deux"><div><label for="f-ch1">Approbation : Chef</label><input type="text" id="f-ch1"></div><div><label for="f-ch2">Approbation : Chef</label><input type="text" id="f-ch2"></div></div>
      <div class="actions"><button class="btn-p" id="b-imp" type="button">🖨 Imprimer</button><button class="btn-s" id="b-garder" type="button">💾 Enregistrer dans l'historique</button><button class="btn-s" id="b-vider" type="button">Nouvel ordre</button></div>
    </div>
    <div class="bloc"><h2>🗂 Historique <button class="btn-s" id="h-tout" type="button" style="float:right">🗑 Tout supprimer</button></h2><div id="histo"></div></div>
  </div>
  <div class="apercu"><div id="feuille"></div></div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (window.Api && Api.demo) $('demo').hidden = false;
  var NB = 8, CLE = 'ordre_travail_histo', DEF = { div: 'Infrastructure', lieu: 'RNS', imp: '4300045000', svc: 'Électromécanique' };   // division, lieu et imputation : ceux de l'Infrastructure par défaut, modifiables
  function E(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fr(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
  function iso() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function lignes(t) { return String(t || '').split(/\r?\n/).map(function (l) { return l.replace(/^\s*[-–•]\s*/, '').trim(); }).filter(Boolean); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.className = 'toast show'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = 'toast'; }, 3000); }
  var CH = ['div', 'lieu', 'imp', 'num', 'le', 'equ', 'suivi', 'desc', 'h', 'rep', 'res', 'svc', 'resp', 'ch1', 'ch2'];
  // lignes de pièces (désignation, Q.SH, Q.PR) et d'agents (nom, heure)
  var pieces = [], agents = [];
  for (var i = 0; i < NB; i += 1) {
    var d1 = document.createElement('div'); d1.className = 'lig p';
    ['des', 'qsh', 'qpr'].forEach(function (k) { var x = document.createElement('input'); x.type = 'text'; x.setAttribute('aria-label', 'Pièce ' + (pieces.length + 1) + ' ' + k); x.dataset.k = k; d1.appendChild(x); x.addEventListener('input', apercu); });
    $('l-pieces').appendChild(d1); pieces.push(d1);
    var d2 = document.createElement('div'); d2.className = 'lig a';
    ['nom', 'heure'].forEach(function (k) { var x = document.createElement('input'); x.type = 'text'; x.setAttribute('aria-label', 'Agent ' + (agents.length + 1) + ' ' + k); x.dataset.k = k; if (k === 'nom') x.setAttribute('list', 'dl-pers'); d2.appendChild(x); x.addEventListener('input', apercu); });
    $('l-agents').appendChild(d2); agents.push(d2);
  }
  function lire() {
    var v = {}; CH.forEach(function (k) { v[k] = $('f-' + k).value; });
    var r = document.querySelector('input[name=f-four]:checked'); v.four = r ? r.value : '';
    v.pieces = pieces.map(function (d) { var o = {}; d.querySelectorAll('input').forEach(function (x) { o[x.dataset.k] = x.value; }); return o; });
    v.agents = agents.map(function (d) { var o = {}; d.querySelectorAll('input').forEach(function (x) { o[x.dataset.k] = x.value; }); return o; });
    return v;
  }
  function ecrire(v) {
    CH.forEach(function (k) { $('f-' + k).value = v[k] || ''; });
    document.querySelectorAll('input[name=f-four]').forEach(function (r) { r.checked = r.value === v.four; });
    pieces.forEach(function (d, i) { d.querySelectorAll('input').forEach(function (x) { x.value = ((v.pieces || [])[i] || {})[x.dataset.k] || ''; }); });
    agents.forEach(function (d, i) { d.querySelectorAll('input').forEach(function (x) { x.value = ((v.agents || [])[i] || {})[x.dataset.k] || ''; }); });
    apercu();
  }
  function neuf() { var v = { le: iso() }; Object.keys(DEF).forEach(function (k) { v[k] = DEF[k]; }); return v; }
  function pts(n) { return '<span style="color:#777">' + new Array(n + 1).join('.') + '</span>'; }
  function apercu() {
    var v = lire(), des = lignes(v.desc);
    var rows = '';
    for (var i = 0; i < NB; i += 1) {
      var p = v.pieces[i] || {}, a = v.agents[i] || {};
      rows += '<tr>' + (i === 0 ? '<td class="r" rowspan="' + NB + '" style="width:21%">' + E(v.res) + '</td>' : '') + '<td>' + E(p.des) + '</td><td style="width:5%;text-align:center">' + E(p.qsh) + '</td><td style="width:5%;text-align:center">' + E(p.qpr) + '</td>' +
        '<td style="width:16%">' + E(a.nom) + '</td><td style="width:6%;text-align:center">' + E(a.heure) + '</td>' + (i === 0 ? '<td rowspan="' + NB + '" style="width:16%"></td>' : '') + '</tr>';
    }
    $('feuille').innerHTML =
      '<div class="tete">SONATRACH DIVISION PRODUCTION Direction Régionale Rhourde Nouss</div>' +
      '<div class="haut"><div class="id">Division : ' + (E(v.div) || pts(12)) + '<br>Lieu : ' + (E(v.lieu) || pts(12)) + '<br>Imputation : ' + (E(v.imp) || pts(12)) + '</div>' +
      '<h1>ORDRE DE TRAVAIL</h1>' +
      '<table class="cadre"><tr><td>Ordre de Travail N° :</td><td>' + E(v.num) + '</td></tr><tr><td>Equipement ou installation :</td><td>' + E(v.equ) + '</td></tr><tr><td>&nbsp;Suivi Par :</td><td>' + E(v.suivi) + '</td></tr><tr><td>&nbsp;Rhourde Nouss le :</td><td>' + (fr(v.le) || '') + '</td></tr></table></div>' +
      '<div class="mid"><div class="desc"><b>DESCRIPTION DU TRAVAIL :</b><div>' + (des.length ? des.map(function (l) { return '- ' + E(l); }).join('<br>') : '-') + '</div></div>' +
      '<table class="cadre"><tr><td rowspan="2">Fourniture de Pièces :<br>Avec ou sans Pièces</td><td class="coche' + (v.four === 'AVEC' ? ' on' : '') + '">AVEC' + (v.four === 'AVEC' ? ' ✔' : '') + '</td></tr><tr><td class="coche' + (v.four === 'SANS' ? ' on' : '') + '">SANS' + (v.four === 'SANS' ? ' ✔' : '') + '</td></tr>' +
      '<tr><td>Nbre d\'heures d\'intervention :</td><td>' + E(v.h) + '</td></tr><tr><td>Date de réparation :</td><td>' + (fr(v.rep) || '') + '</td></tr></table></div>' +
      '<table class="princ"><thead><tr><th>Résumé des Travaux</th><th>Pièces de rechanges utilisées</th><th>Q.SH</th><th>Q.PR</th><th>Agents intervenants</th><th>Heure</th><th>Approbation chef de service</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<table class="bas"><tr><td style="width:21%">Service ' + E(v.svc) + '<br>NOM et Visa Emetteur</td><td colspan="2">APPROBATION</td><td style="width:21%">Responsable<br>Exécution' + (v.resp ? '<br><b>' + E(v.resp) + '</b>' : '') + '</td><td style="width:22%">Date et Signature<br>à Réception</td></tr>' +
      '<tr><td rowspan="2" class="le">Le :</td><td style="width:18%;text-align:left">Chef : ' + E(v.ch1) + '</td><td style="width:18%;text-align:left">Chef : ' + E(v.ch2) + '</td><td rowspan="2" class="le">Le :</td><td rowspan="2" class="le">Le :</td></tr><tr><td class="le">Le :</td><td class="le">Le :</td></tr></table>';
    ajuster();
  }
  function ajuster() { var z = $('feuille').parentNode, l = z.clientWidth - 28, w = $('feuille').offsetWidth || 1122; var k = Math.min(1, l / w); $('feuille').style.transform = k < 1 ? 'scale(' + k + ')' : ''; z.style.height = k < 1 ? Math.ceil($('feuille').offsetHeight * k + 28) + 'px' : ''; }
  window.addEventListener('resize', ajuster);
  CH.concat(['four']).forEach(function (k) { var e = $('f-' + k); if (e) e.addEventListener('input', apercu); });
  document.querySelectorAll('input[name=f-four]').forEach(function (r) { r.addEventListener('change', apercu); });

  // personnes de l'annuaire (suggestions pour « Suivi par » et les agents intervenants)
  if (window.Api) Api.call('annuaire_personnes').then(function (r) { var dl = $('dl-pers'); (r.personnes || []).forEach(function (p) { if (!p.nom) return; var o = document.createElement('option'); o.value = p.nom; dl.appendChild(o); }); }).catch(function () { /* sans annuaire : saisie libre */ });

  // historique (ce navigateur)
  function histo() { try { return JSON.parse(localStorage.getItem(CLE) || '[]'); } catch (e) { return []; } }
  function sauver(l) { try { localStorage.setItem(CLE, JSON.stringify(l.slice(0, 60))); } catch (e) { /* stockage indisponible */ } dessinerHisto(); }
  function dessinerHisto() {
    var z = $('histo'), l = histo(); z.textContent = ''; $('h-tout').hidden = !l.length;
    if (!l.length) { var p = document.createElement('p'); p.style.cssText = 'font-size:12.5px;color:var(--text-muted)'; p.textContent = 'Aucun ordre de travail enregistré sur cet ordinateur.'; z.appendChild(p); return; }
    l.forEach(function (v, i) {
      var d = document.createElement('div'); d.className = 'histo'; var c = document.createElement('div'); c.className = 'i';
      var b = document.createElement('b'); b.textContent = (v.num ? 'N° ' + v.num + ' — ' : '') + (v.equ || '(sans équipement)'); var s = document.createElement('small'); s.textContent = fr(v.le) + ' · ' + (v.suivi || '');
      c.appendChild(b); c.appendChild(s); d.appendChild(c);
      var o = document.createElement('button'); o.className = 'btn-s'; o.type = 'button'; o.textContent = 'Rouvrir'; o.onclick = function () { ecrire(v); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      var x = document.createElement('button'); x.className = 'btn-s'; x.type = 'button'; x.textContent = '🗑'; x.title = 'Supprimer'; x.onclick = function () { if (!confirm('Supprimer cet ordre de travail de l\'historique ?')) return; var h = histo(); h.splice(i, 1); sauver(h); };
      d.appendChild(o); d.appendChild(x); z.appendChild(d);
    });
  }
  function garder() { var v = lire(); if (!String(v.equ).trim() && !lignes(v.desc).length) { toast('Indiquez au moins l\'équipement ou la description du travail.'); return false; } var h = histo().filter(function (x) { return JSON.stringify(x) !== JSON.stringify(v); }); h.unshift(v); sauver(h); return true; }
  $('b-garder').onclick = function () { if (garder()) toast('Enregistré dans l\'historique.'); };
  $('b-imp').onclick = function () { garder(); window.print(); };          // impression en un clic (fenêtre d'impression directe), l'ordre est gardé dans l'historique
  $('b-vider').onclick = function () { ecrire(neuf()); };
  $('h-tout').onclick = function () { if (confirm('Supprimer tout l\'historique de cet ordinateur ?')) sauver([]); };
  ecrire(neuf()); dessinerHisto();
})();
</script>
<script src="js/pied.js"></script>
</body>
</html>
