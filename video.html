<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vidéo de formation – Division Infrastructure RNS</title>
<meta name="theme-color" content="#E85D04">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/charte.css">
<script src="js/config.js"></script><script src="js/api.js"></script>
<style>
  .vd { max-width: 960px; margin: 0 auto; padding: 16px 16px 40px; text-align: center; }
  .vd video { width: 100%; border-radius: 14px; box-shadow: var(--shadow-card); background: #000; }
  .vd h2 { margin: 6px 0 4px; } .vd p { color: var(--text-muted); margin: 0 0 14px; }
  .btn-p { display: inline-block; padding: 11px 22px; border-radius: 10px; background: linear-gradient(135deg, var(--orange-main), var(--orange-light)); color: #fff; font-weight: 700; text-decoration: none; margin: 14px 6px 0; }
  .btn-s2 { display: inline-block; padding: 10px 20px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-dark); font-weight: 700; text-decoration: none; margin: 14px 6px 0; }
</style>
</head>
<body>
<header class="bandeau"><div class="bandeau-inner">
  <div class="logo-area"><div class="logo-circle">▶</div>
    <div class="logo-text"><h1>Vidéo de formation</h1><p>Sonatrach · RNS · Division Infrastructure</p></div></div>
  <div class="bandeau-droite"><a class="btn-ghost" href="portail.html" style="text-decoration:none">Portail</a></div>
</div></header>
<main class="vd">
  <h2 id="t"></h2><p id="d"></p>
  <video id="v" controls preload="metadata" playsinline hidden></video>
  <p id="m" class="msg">Chargement de la vidéo…</p>
  <div><a class="btn-p" id="b-ouvrir" href="portail.html">Ouvrir le portail</a><a class="btn-s2" id="b-tel" href="#" download="video.mp4" hidden>⬇ Télécharger la vidéo</a></div>
</main>
<script>
(function () {
  // La vidéo n'est plus publiée sur le site : elle est servie par la passerelle après connexion. Sans session, on passe par la connexion puis on revient ici.
  var VIDEOS = { 'rapports-journaliers': { titre: 'Rapports journaliers : du rapport du jour au consolidé', desc: 'Saisir le rapport du jour, le corriger, générer le consolidé, voir les destinataires et l\'envoyer (1 min 53).' }, 'fiche-evaluation': { titre: 'Fiche d\'évaluation : comment l\'utiliser', desc: 'Choisir le contrat, cocher les critères, générer la fiche PDF, l\'imprimer ou l\'envoyer (1 min 37).' } };
  var k = new URLSearchParams(location.search).get('v') || 'fiche-evaluation', id = VIDEOS[k] ? k : 'fiche-evaluation', d = VIDEOS[id];
  document.getElementById('t').textContent = d.titre; document.getElementById('d').textContent = d.desc;
  if (!window.Api || !Api.token()) { try { sessionStorage.setItem('infra_retour', location.pathname.split('/').pop() + location.search); } catch (e) { /* rien */ } location.replace('connexion.html'); return; }
  var m = document.getElementById('m');
  Api.call('video_formation', { id: id }).then(function (r) {
    var oct = atob(r.mp4), u = new Uint8Array(oct.length); for (var i = 0; i < oct.length; i += 1) u[i] = oct.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([u], { type: 'video/mp4' })), v = document.getElementById('v');
    if (r.poster) v.poster = 'data:image/jpeg;base64,' + r.poster; v.src = url; v.hidden = false; m.hidden = true;
    var a = document.getElementById('b-tel'); a.href = url; a.download = id + '.mp4'; a.hidden = false;
  }).catch(function (e) { m.textContent = (e && e.code === 'SESSION') ? 'Session expirée : reconnectez-vous.' : 'Vidéo indisponible pour le moment (' + (e && e.message ? e.message : 'erreur') + ').'; });
})();
</script>
<script src="js/pied.js"></script>
</body>
</html>
