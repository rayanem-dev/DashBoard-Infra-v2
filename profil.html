<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mon profil – Division Infrastructure RNS</title>
<meta name="theme-color" content="#E85D04">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/charte.css">
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/garde.js"></script>
<style>
  .pf { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  .bloc { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-card); padding: 16px 18px; margin-bottom: 14px; }
  .bloc h2 { font-size: 15px; margin: 0 0 10px; }
  .photo { text-align: center; } .rond { width: 132px; height: 132px; border-radius: 50%; margin: 0 auto 10px; background: #FCE9D6; color: #B94E00; font: 800 44px Inter, sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 0 4px var(--tint-orange, #FFF1E6); }
  .rond img { width: 100%; height: 100%; object-fit: cover; }
  .photo h3 { margin: 4px 0 2px; font-size: 18px; } .photo .sous { color: var(--text-muted); font-size: 13px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .btn-p { padding: 9px 16px; border: 0; border-radius: 10px; background: linear-gradient(135deg, var(--orange-main), var(--orange-light)); color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .champs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .champs label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin: 0 0 3px; }
  .champs input, .champs select { width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 9px; font: inherit; font-size: 14px; background: var(--surface); color: var(--text-dark); box-sizing: border-box; }
  .champs input[readonly] { background: var(--bg, #F5F5F0); color: var(--text-muted); } .cad { font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .msg { font-size: 13px; margin-top: 8px; min-height: 18px; } .msg.err { color: #B42318; } .msg.ok { color: #166534; }
  .pfapp { display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border); padding: 8px 2px; font-size: 14px; } .pfapp .t { flex: 1; min-width: 0; } .pfapp small { display: block; color: var(--text-muted); font-size: 12px; }
  .ok-pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #DCFCE7; color: #166534; } .att-pill { background: #FEF3C7; color: #92400E; }
  details.liste > summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  @media (max-width: 860px) { .pf { grid-template-columns: 1fr; } .champs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="bandeau"><div class="bandeau-inner">
  <div class="logo-area"><div class="logo-circle">👤</div>
    <div class="logo-text"><h1>Mon profil</h1><p>Sonatrach · RNS · Division Infrastructure</p></div></div>
  <div class="bandeau-droite"><a class="btn-ghost" href="portail.html" style="text-decoration:none">← Retour au portail</a></div>
</div></header>
<div id="demo" class="demo-banner" hidden>MODE DÉMO — données fictives</div>
<main class="pf">
  <div>
    <div class="bloc photo">
      <div class="rond" id="rond"></div>
      <h3 id="p-nom"></h3><div class="sous" id="p-sous"></div><div id="p-badges" style="margin-top:6px"></div>
      <div class="actions"><button class="btn-p" id="b-photo" type="button">📷 Changer la photo</button><button class="btn-s" id="b-retirer" type="button" hidden>Retirer</button></div>
      <input type="file" id="f-photo" accept="image/*" hidden>
      <div class="msg" id="m-photo"></div>
    </div>
    <div class="bloc" id="bloc-mdp">
      <h2>🔒 Mot de passe</h2>
      <div class="champs" style="grid-template-columns:1fr"><div><label for="m-anc">Mot de passe actuel</label><input type="password" id="m-anc" autocomplete="current-password"></div>
        <div><label for="m-nv">Nouveau <span class="cad">(4 caractères minimum)</span></label><input type="password" id="m-nv" autocomplete="new-password"></div>
        <div><label for="m-cf">Confirmer le nouveau</label><input type="password" id="m-cf" autocomplete="new-password"></div></div>
      <div class="actions" style="justify-content:flex-start"><button class="btn-s" id="b-mdp" type="button">Changer le mot de passe</button></div><div class="msg" id="m-mdp"></div>
    </div>
  </div>
  <div>
    <div class="bloc">
      <h2>🪪 Mes informations <span class="cad" style="font-weight:400;color:var(--text-muted)">· 🔒 = vient de BDDORGA, non modifiable ici</span></h2>
      <div class="champs" id="champs"></div>
      <div class="actions" style="justify-content:flex-start"><button class="btn-p" id="b-enreg" type="button">💾 Enregistrer</button></div><div class="msg" id="m-enreg"></div>
    </div>
    <div class="bloc">
      <h2>🔑 Mes accès</h2>
      <details class="liste" open><summary id="s-acc"></summary><div id="l-acc"></div></details>
      <details class="liste" open style="margin-top:8px"><summary id="s-non"></summary><div id="l-non"></div></details>
      <div class="msg" id="m-acc"></div>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="js/employeurs.js"></script>
<script src="js/rubriques.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (window.Api && Api.demo) $('demo').hidden = false;
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function msg(id, t, ok) { var m = $(id); m.textContent = t || ''; m.className = 'msg' + (t ? (ok ? ' ok' : ' err') : ''); }
  function ini(n) { var m = String(n || '?').trim().split(/\s+/); return ((m[0] || '?').charAt(0) + (m[1] || '').charAt(0)).toUpperCase(); }
  function fr(i) { return i ? String(i).slice(8, 10) + '/' + String(i).slice(5, 7) + '/' + String(i).slice(0, 4) : ''; }
  var U = null, photo = '';

  // ---------- identité et photo ----------
  function dessinerTete() {
    var r = $('rond'); r.textContent = ''; if (photo) { var i = new Image(); i.src = photo; i.alt = ''; r.appendChild(i); } else r.textContent = ini(U.nom);
    $('p-nom').textContent = U.nom_affiche || U.nom; $('p-sous').textContent = [U.fonction, U.service].filter(Boolean).join(' · ');
    var b = $('p-badges'); b.textContent = ''; var pe = window.Employeur && Employeur.pastille(U.dependance); if (pe) { pe.style.marginLeft = '0'; b.appendChild(pe); } if (U.role_libelle) b.appendChild(el('span', 'ok-pill att-pill', U.role_libelle));
    $('b-retirer').hidden = !photo;
  }
  /** Image choisie → deux JPEG carrés (grand 240 px, miniature 56 px), recadrés au centre : jamais d'envoi de l'original. */
  function reduire(img, t, q) { var c = document.createElement('canvas'); c.width = c.height = t; var x = c.getContext('2d'), s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2; x.fillStyle = '#fff'; x.fillRect(0, 0, t, t); x.drawImage(img, sx, sy, s, s, 0, 0, t, t); return c.toDataURL('image/jpeg', q); }
  $('b-photo').addEventListener('click', function () { $('f-photo').click(); });
  $('f-photo').addEventListener('change', function () {
    var f = this.files && this.files[0]; this.value = ''; if (!f) return;
    if (!/^image\//.test(f.type)) return msg('m-photo', 'Choisissez une image.');
    var rd = new FileReader(); rd.onload = function () {
      var img = new Image(); img.onload = function () {
        var g = reduire(img, 240, .85); if (g.length > 44000) g = reduire(img, 240, .7); if (g.length > 44000) g = reduire(img, 200, .7); var m = reduire(img, 56, .8); msg('m-photo', 'Enregistrement…', true);
        Api.call('profil_photo', { grand: g, mini: m }).then(function () { photo = g; try { sessionStorage.removeItem('infra_avatar'); } catch (e) {} dessinerTete(); msg('m-photo', 'Photo enregistrée (visible partout dans le portail).', true); }).catch(function (e) { msg('m-photo', e.message); });
      }; img.onerror = function () { msg('m-photo', 'Image illisible.'); }; img.src = rd.result;
    }; rd.readAsDataURL(f);
  });
  $('b-retirer').addEventListener('click', function () { Api.call('profil_photo', { grand: '', mini: '' }).then(function () { photo = ''; try { sessionStorage.removeItem('infra_avatar'); } catch (e) {} dessinerTete(); msg('m-photo', 'Photo retirée.', true); }).catch(function (e) { msg('m-photo', e.message); }); });

  // ---------- champs ----------
  var EDIT = {};   // id → champ modifiable
  function champ(lib, id, val, mode, extra) {   // mode : 'fixe' | 'edit' | 'unefois'
    var w = el('div'), l = el('label', null, (mode === 'fixe' ? '🔒 ' : '') + lib); if (extra) l.appendChild(el('span', 'cad', ' ' + extra)); w.appendChild(l);
    var i = el('input'); i.id = 'c-' + id; i.value = val || ''; i.autocomplete = 'off';
    if (mode === 'fixe') i.readOnly = true; else EDIT[id] = { mode: mode, el: i };
    if (id === 'date_integration') i.type = 'date';
    w.appendChild(i); return w;
  }
  function dessinerChamps() {
    var z = $('champs'); z.textContent = ''; EDIT = {};
    z.appendChild(champ('Nom affiché', 'nom_affiche', U.nom_affiche || U.nom, 'edit', '(salutations ; le nom officiel reste ' + U.nom + ')'));
    z.appendChild(champ('Civilité', 'civilite', U.civilite, 'edit', '(M., Mme…)'));
    z.appendChild(champ('Fonction', 'fonction', U.fonction, 'fixe')); z.appendChild(champ('Service', 'service', U.service, 'fixe'));
    z.appendChild(champ('Employeur', 'dependance', U.dependance || 'SONATRACH', 'fixe')); z.appendChild(champ('Rôle', 'role', U.role_libelle || U.role, 'fixe'));
    z.appendChild(champ('Date d\'intégration', 'date_integration', U.date_integration, 'edit'));
    z.appendChild(champ('Matricule', 'matricule', U.matricule, U.matricule ? 'fixe' : 'unefois', U.matricule ? '' : '(à compléter une fois)'));
    z.appendChild(champ('Matricule SAP', 'sap', U.sap, U.sap ? 'fixe' : 'unefois', U.sap ? '(corrigé par le secrétariat)' : '(à compléter une fois)'));
    z.appendChild(champ('NIN', 'nin', U.nin_masque, U.nin_renseigne ? 'fixe' : 'unefois', U.nin_renseigne ? '(corrigé par le secrétariat)' : '(18 chiffres, à compléter une fois)'));
    z.appendChild(champ('Identifiant SONA', 'sona', U.sona, 'fixe')); z.appendChild(champ('E-mail du compte', 'email', U.email, 'fixe'));
    var em = champ('E-mail de contact', 'email_contact', U.email_contact || U.email, 'fixe', '(reçoit vos codes de connexion)'); var bm = el('button', 'btn-s', 'Modifier (code de confirmation)'); bm.type = 'button'; bm.style.marginTop = '6px'; bm.addEventListener('click', ouvrirEmail); em.appendChild(bm); z.appendChild(em);
    z.appendChild(champ('Téléphone', 'telephone', U.telephone, 'edit')); z.appendChild(champ('Identifiant Wi-Fi', 'wifi_user', U.wifi_user, 'edit'));
  }
  $('b-enreg').addEventListener('click', function () {
    var corps = {}, unefois = {}, n = 0;
    Object.keys(EDIT).forEach(function (k) {
      var e = EDIT[k], v = e.el.value.trim();
      if (e.mode === 'unefois') { if (v) { unefois[k] = v; n += 1; } return; }
      var avant = k === 'nom_affiche' ? (U.nom_affiche || U.nom) : (U[k] || ''); if (v !== avant) { corps[k] = v; n += 1; }
    });
    if (!n) return msg('m-enreg', 'Rien n\'a changé.');
    msg('m-enreg', 'Enregistrement…', true);
    var p = Object.keys(corps).length ? Api.call('profil_maj', corps) : Promise.resolve(null);
    p.then(function () { return Object.keys(unefois).length ? Api.call('profil_enregistrer', unefois) : null; })
      .then(function () { return charger(); }).then(function () { try { sessionStorage.removeItem('infra_avatar'); } catch (e) {} msg('m-enreg', 'Enregistré.', true); })
      .catch(function (e) { msg('m-enreg', e.message); });
  });
  function ouvrirEmail() {
    var dlg = el('dialog', 'dlg'), f = el('form'); f.method = 'dialog'; f.appendChild(el('h2', null, 'Mon adresse e-mail'));
    f.appendChild(el('p', 'aide', 'Un code de confirmation sera envoyé à la nouvelle adresse.'));
    var a = el('input'); a.type = 'email'; a.autocomplete = 'email'; a.style.cssText = 'width:100%;padding:10px;border:1.5px solid #E5E7EB;border-radius:10px;font:inherit'; f.appendChild(a);
    var c = el('input'); c.inputMode = 'numeric'; c.maxLength = 6; c.placeholder = 'Code reçu'; c.hidden = true; c.style.cssText = 'width:100%;padding:10px;border:1.5px solid #E5E7EB;border-radius:10px;font:inherit;margin-top:8px'; f.appendChild(c);
    var m = el('div', 'msg'); f.appendChild(m); var bt = el('div', 'actions'), ann = el('button', 'btn-s', 'Annuler'), ok = el('button', 'btn-p', 'Envoyer le code'); ann.type = 'button'; ok.type = 'submit'; bt.appendChild(ann); bt.appendChild(ok); f.appendChild(bt);
    var etape = 1; ann.addEventListener('click', function () { dlg.close(); });
    f.addEventListener('submit', function (e) { e.preventDefault(); ok.disabled = true; m.className = 'msg';
      if (etape === 1) Api.call('email_contact_demander', { adresse: a.value }).then(function (r) { etape = 2; c.hidden = false; a.readOnly = true; ok.textContent = 'Confirmer'; ok.disabled = false; m.textContent = 'Code envoyé à ' + r.masque + '.'; m.className = 'msg ok'; }).catch(function (er) { m.textContent = er.message; m.className = 'msg err'; ok.disabled = false; });
      else Api.call('email_contact_confirmer', { code: c.value }).then(function () { dlg.close(); try { sessionStorage.removeItem('infra_avatar'); } catch (x) {} charger(); }).catch(function (er) { m.textContent = er.message; m.className = 'msg err'; ok.disabled = false; });
    });
    dlg.addEventListener('close', function () { dlg.remove(); }); dlg.appendChild(f); document.body.appendChild(dlg); dlg.showModal ? dlg.showModal() : dlg.setAttribute('open', '');
  }
  $('b-mdp').addEventListener('click', function () {
    if ($('m-nv').value !== $('m-cf').value) return msg('m-mdp', 'Les deux nouveaux mots de passe sont différents.');
    Api.call('changer_mdp', { ancien: $('m-anc').value, nouveau: $('m-nv').value }).then(function () { msg('m-mdp', 'Mot de passe changé.', true); $('m-anc').value = $('m-nv').value = $('m-cf').value = ''; }).catch(function (e) { msg('m-mdp', e.message); });
  });

  // ---------- accès ----------
  /** Classe les applications dans les mêmes familles et le même ordre que le menu du portail : la liste suit donc tout seul les changements de catégories et les nouvelles applications. */
  function grouper(liste) {
    var defs = window.Rubriques ? Rubriques.definitions : [], par = {}, autres = {}, ordre = [];
    liste.forEach(function (x) { var r = window.Rubriques ? Rubriques.rubriqueDe({ titre: x.titre, url: x.url || '', rubrique: x.rubrique }) : ''; if (r) (par[r] = par[r] || []).push(x); else { var k = x.module || 'Autres'; if (!autres[k]) { autres[k] = []; ordre.push(k); } autres[k].push(x); } });
    var out = []; defs.forEach(function (d) { if (par[d.id]) out.push({ titre: d.icone + ' ' + d.titre, apps: par[d.id] }); }); ordre.forEach(function (k) { out.push({ titre: '📁 ' + k, apps: autres[k] }); });
    return out;
  }
  function entete(z, t, n) { var h = el('div', null, t + ' (' + n + ')'); h.style.cssText = 'font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin:10px 0 2px'; z.appendChild(h); }
  function dessinerAcces(a, dem) {
    var att = {}; dem.forEach(function (d) { if (d.statut === 'en_attente') att[d.titre] = true; });
    $('s-acc').textContent = '✅ J\'ai accès à ' + a.accessibles.length + ' application(s)'; var la = $('l-acc'); la.textContent = '';
    grouper(a.accessibles).forEach(function (g) { entete(la, g.titre, g.apps.length); g.apps.forEach(function (x) { var d = el('div', 'pfapp'); d.appendChild(el('span', null, x.emoji || '▫️')); var t = el('div', 't'); var lk = el('a', null, x.titre); lk.href = x.url; lk.style.cssText = 'color:inherit;font-weight:700;text-decoration:none'; if (/^https?:/.test(x.url)) lk.target = '_blank'; t.appendChild(lk); d.appendChild(t); la.appendChild(d); }); });
    $('s-non').textContent = '⛔ Je n\'ai pas accès à ' + a.non_accessibles.length + ' application(s)'; var ln = $('l-non'); ln.textContent = '';
    grouper(a.non_accessibles).forEach(function (g) { entete(ln, g.titre, g.apps.length); g.apps.forEach(function (x) {
      var d = el('div', 'pfapp'); d.appendChild(el('span', null, x.emoji || '▫️')); var t = el('div', 't'); t.appendChild(el('b', null, x.titre)); if (x.description) t.appendChild(el('small', null, x.description)); d.appendChild(t);
      if (att[x.titre]) d.appendChild(el('span', 'ok-pill att-pill', 'Demande envoyée'));
      else { var b = el('button', 'btn-s', 'Demander l\'accès'); b.type = 'button'; b.addEventListener('click', function () {
        var motif = prompt('Pourquoi avez-vous besoin de « ' + x.titre + ' » ? (facultatif)\nLa demande sera envoyée par e-mail au secrétariat.'); if (motif === null) return;
        b.disabled = true; Api.call('acces_demander', { titre: x.titre, motif: motif }).then(function (r) { msg('m-acc', 'Demande ' + r.numero + ' envoyée au secrétariat.', true); charger(); }).catch(function (e) { msg('m-acc', e.message); b.disabled = false; }); }); d.appendChild(b); }
      ln.appendChild(d); }); });
    var suivies = dem.filter(function (d) { return d.statut !== 'en_attente'; }).slice(0, 5);
    if (suivies.length) { var h = el('div', 'msg', 'Dernières demandes traitées : ' + suivies.map(function (d) { return d.titre + ' (' + (d.statut === 'accordee' ? 'accordée' : 'refusée') + ')'; }).join(', ')); la.appendChild(h); }
  }
  function charger() {
    return Api.call('profil_moi').then(function (r) { U = r.user; photo = r.photo || ''; dessinerTete(); dessinerChamps(); dessinerAcces(r.acces, r.demandes || []); });
  }
  charger().then(function () { if (location.hash === '#mdp') { $('bloc-mdp').scrollIntoView(); $('m-anc').focus(); } }).catch(function (e) { msg('m-enreg', e.message); });
})();
</script>
<script src="js/pied.js"></script>
</body>
</html>
